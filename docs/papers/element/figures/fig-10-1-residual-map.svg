<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 300" font-family="Georgia, serif" fill="#1a1a1a">
  <style>
    .title { font-size:19px; font-weight:bold; }
    .lab { font-size:13px; }
    .small { font-size:11.5px; fill:#5b5346; }
    .note { font-size:12px; fill:#5b5346; font-style:italic; }
  </style>
  <text x="430" y="30" text-anchor="middle" class="title">The convergence residual — a map of the work that remains</text>

  <!-- stacked bar: explained vs residual -->
  <g>
    <rect x="60" y="66" width="255" height="52" fill="#5b8a72"/>
    <rect x="315" y="66" width="30"  height="52" fill="#b28a3e"/>
    <rect x="345" y="66" width="455" height="52" fill="#c9c0ad"/>
  </g>
  <text x="187" y="98" text-anchor="middle" fill="#fff" class="lab">facets ≈ 36%</text>
  <text x="330" y="135" text-anchor="middle" class="small">empires</text>
  <text x="330" y="150" text-anchor="middle" class="small">+ sliver</text>
  <text x="572" y="98" text-anchor="middle" class="lab">convergence residual ≈ 64%</text>

  <!-- what would close it -->
  <text x="60" y="185" class="lab" font-weight="bold">What the residual names — the joins that would light it up:</text>
  <g class="small" font-size="12.5">
    <text x="70" y="212">◆ fine genetic data — a third axis independent of both language and geography</text>
    <text x="70" y="234">◆ wired trade-route networks — contact channels the coarse landscape model missed</text>
    <text x="70" y="256">◆ node-level Bayesian dating on a dated tree — replacing family-resolution ages</text>
    <text x="70" y="278">◆ finishing motif induction from raw text — growing the corpus rather than inheriting it</text>
  </g>
</svg>
