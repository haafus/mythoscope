# Installed to /etc/systemd/system/caddy.service.d/override.conf by `fab bootstrap`.
# A drop-in rather than an edit: /lib/systemd/system/caddy.service belongs to the
# apt package and comes back on every upgrade.
#
# The packaged unit sets no Restart= at all, so Caddy stays down after any crash
# — an OOM kill took the whole site offline once, /apps included.

[Service]
Restart=always
RestartSec=5s

# The other half of the same fix: under the default OOMPolicy=stop, systemd
# treats an OOM kill as its own stop job, and a unit systemd stopped is never
# restarted whatever Restart= says. `continue` leaves the main process's death
# to the normal restart path.
OOMPolicy=continue

# Prefer killing the app (~375MB, back in ~2s) over the front door that fronts
# it. Read by the kernel OOM killer; systemd-oomd ignores it, but oomd manages
# user.slice rather than system.slice by default, so the kernel is the one
# choosing here. Applies at process start, not at daemon-reload.
OOMScoreAdjust=-500
