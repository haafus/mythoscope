<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cross-walk graph — mockup</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
         color: #212529; background: #faf9f5; }
  header { padding: 12px 18px; border-bottom: 1px solid #dee2e6; background: #fff;
           display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  header h1 { font-size: 15px; margin: 0; font-weight: 700; }
  header .sub { color: #6c757d; font-size: 12px; }
  #search { width: 100%; box-sizing: border-box; padding: 7px 10px; font-size: 13px;
            border: 1px solid #dee2e6; border-radius: 6px; background: rgba(255,255,255,.94); }
  #results { position: absolute; z-index: 26; top: 0; left: 100%; margin-left: 8px; width: 460px;
             background: #fff; border: 1px solid #dee2e6; border-radius: 8px;
             max-height: calc(100vh - 76px); overflow-y: auto; box-shadow: 0 4px 14px rgba(0,0,0,.08);
             display: none; }
  #results div { padding: 6px 10px; font-size: 12.5px; cursor: pointer; border-bottom: 1px solid #f1f3f5; }
  #results div:hover { background: #eef4fb; }
  #results .rid { font-weight: 700; }
  main { position: relative; height: calc(100vh - 52px); }
  canvas { display: block; width: 100%; height: 100%; cursor: grab; }
  canvas.drag { cursor: grabbing; }
  .legend { position: absolute; bottom: 14px; left: 14px; background: rgba(255,255,255,.94);
            border: 1px solid #dee2e6; border-radius: 8px; padding: 10px 12px; font-size: 11.5px;
            max-height: 52vh; overflow-y: auto; max-width: 260px; }
  .legend b { display: block; margin: 6px 0 3px; color: #6c757d; font-weight: 600;
              text-transform: uppercase; font-size: 9.5px; letter-spacing: .04em; }
  .legend .row { display: flex; align-items: center; gap: 6px; margin: 2px 0; }
  .dot { width: 10px; height: 10px; border-radius: 50%; flex: 0 0 auto; }
  .ln { width: 16px; height: 0; border-top: 3px solid; }
  .tip { position: absolute; z-index: 30; pointer-events: none; background: #111827; color: #fff;
         padding: 5px 9px; border-radius: 6px; font-size: 12px; max-width: 280px; display: none; }
  .ctl { position: absolute; top: 12px; right: 12px; background: rgba(255,255,255,.94);
         border: 1px solid #dee2e6; border-radius: 8px; padding: 8px 11px; font-size: 12px;
         max-height: calc(100vh - 78px); overflow-y: auto; width: 232px; }
  .ctl label { display: block; margin: 3px 0; cursor: pointer; }
  .ctl label.det { margin-left: 13px; display: flex; align-items: center; gap: 6px; }
  .ctl label.det .lbl { flex: 1; }
  .ctl label.det:has(input:not(:checked)) .lbl { text-decoration: line-through; color: #b0b6bd; }
  .ctl .sw { flex: 0 0 auto; }
  .ctl input[type=checkbox] { accent-color: #9aa7b2; flex: 0 0 auto; }
  .ctl-h { margin: 8px 0 2px; font-size: 9.5px; font-weight: 600; text-transform: uppercase;
           letter-spacing: .04em; color: #6c757d; border-top: 1px solid #eef1f4; padding-top: 6px; }
  .ctl-h.grp { display: flex; gap: 5px; align-items: center; cursor: pointer; }
  .ctl-note { font-size: 9.5px; color: #9299a1; margin: 6px 0 1px; }
  .ctl .row { padding-left: 3px; display: flex; align-items: center; gap: 6px; margin: 2px 0; }
  .bmode { display: flex; gap: 4px; padding: 7px 8px 0; }
  .bmode button { flex: 1; padding: 5px 4px; font-size: 11.5px; border: 1px solid #dee2e6;
                  border-radius: 5px; background: #fff; cursor: pointer; }
  .bmode button.active { background: #111827; color: #fff; border-color: #111827; }
  .comp { display: flex; height: 5px; width: 46px; border-radius: 3px; overflow: hidden; background: #eef1f4; flex: 0 0 auto; }
  .comp > i { height: 100%; }
  #blist .cl-lab { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }
  #leftcol { position: absolute; top: 12px; left: 12px; width: 236px; z-index: 15;
             display: flex; flex-direction: column; gap: 8px; }
  .focusinfo { background: rgba(255,255,255,.94); border: 1px solid #dee2e6; border-radius: 8px;
               padding: 8px 11px; font-size: 12px; }
  .filterbox { background: rgba(255,255,255,.94); border: 1px solid #dee2e6; border-radius: 8px;
               padding: 8px 11px; font-size: 12px; }
  .filterbox .fb-h { font-size: 11px; color: #495057; }
  .filterbox input[type=range] { width: 100%; accent-color: #c6ccd2; height: 3px; margin: 7px 0 3px; }
  .filterbox .fb-note { font-size: 10.5px; color: #9299a1; }
  .leftbtns { display: flex; gap: 8px; }
  .leftbtns .btn { flex: 1; text-align: center; }
  .focusinfo .fi-id { font-weight: 700; }
  .focusinfo .fi-n { color: #374151; }
  .focusinfo .fi-d { color: #6c757d; font-size: 11px; margin-top: 2px; }
  .btn { padding: 9px 12px; font-size: 12.5px; border: 1px solid #dee2e6; border-radius: 6px;
         background: #fff; cursor: pointer; white-space: nowrap; }
  .btn:hover { background: #eef4fb; }
  .btn:active, .btn.on { background: #111827; color: #fff; border-color: #111827; }
  #browse { position: absolute; z-index: 25; top: 0; left: 100%; margin-left: 8px; width: 460px; max-height: calc(100vh - 76px);
            background: #fff; border: 1px solid #dee2e6; border-radius: 8px;
            box-shadow: 0 6px 20px rgba(0,0,0,.1); display: none; flex-direction: column; }
  #browse .bhead { padding: 8px 10px 6px; font-size: 11px; color: #6c757d; border-bottom: 1px solid #f1f3f5; }
  .bfilter { display: flex; gap: 4px; padding: 7px 8px; border-bottom: 1px solid #f1f3f5; }
  .bfilter button { flex: 1; padding: 5px 4px; font-size: 11.5px; border: 1px solid #dee2e6;
                    border-radius: 5px; background: #fff; cursor: pointer; }
  .bfilter button.active { background: #111827; color: #fff; border-color: #111827; }
  #blist { overflow-y: auto; }
  #blist div { padding: 6px 10px; font-size: 12.5px; cursor: pointer; border-bottom: 1px solid #f6f7f8;
               display: flex; gap: 7px; align-items: baseline; }
  #blist div:hover { background: #eef4fb; }
  #blist .rid { font-weight: 700; }
  #blist .bn { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #blist .bd { color: #9299a1; font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<header>
  <h1>Cross-walk graph</h1>
  <span class="sub">click a node to recentre · drag to move · scroll to zoom · arrows show link direction</span>
</header>
<main>
  <canvas id="cv"></canvas>
  <div class="tip" id="tip"></div>
  <div id="leftcol">
    <div class="focusinfo" id="focusinfo"></div>
    <div class="filterbox">
      <div class="fb-h">Thin out: min. links per node ≥ <b id="fbval">1</b></div>
      <input type="range" id="degFilter" min="1" max="20" value="1">
      <div class="fb-note" id="fbnote"></div>
    </div>
    <div class="leftbtns">
      <button id="exportBtn" class="btn" title="Download the full graph with the currently enabled layers as two Cosmograph CSVs (links + nodes)">↓ Cosmograph</button>
      <button id="browseBtn" class="btn">☰ Browse</button>
    </div>
    <input id="search" placeholder="Search a motif / type (id or name)…" autocomplete="off">
    <div id="results"></div>
    <div id="browse">
      <div class="bmode">
        <button data-mode="hubs" class="active">Most-linked hubs</button>
        <button data-mode="clusters">Dense clusters</button>
      </div>
      <div class="bhead" id="bhead"></div>
      <div class="bfilter" id="bfilter">
        <button data-x="" class="active">All</button>
        <button data-x="tmi">TMI</button>
        <button data-x="atu">ATU</button>
        <button data-x="brz">Berezkin</button>
      </div>
      <div id="bvariant" style="display:none;padding:7px 8px;border-bottom:1px solid #f1f3f5">
        <select id="clsel" style="width:100%;padding:5px 6px;font-size:12px;border:1px solid #dee2e6;border-radius:5px"></select>
      </div>
      <div id="blist"></div>
    </div>
  </div>
  <div class="ctl" id="ctl">
    <label><input type="checkbox" id="depth2"> 2-hop neighbourhood</label>
    <div id="nodeleg"></div>
    <div class="ctl-note">Edge colour = source · opacity = confidence</div>
    <div id="layers"></div>
  </div>
</main>
<script src="data.js"></script>
<script>
const IDX = { tmi:{c:"#2a9d8f",label:"Thompson (TMI)"}, atu:{c:"#3a6ea5",label:"ATU type"}, brz:{c:"#b5651d",label:"Berezkin"} };
const IX3 = { tmi:"TMI", atu:"ATU", brz:"BRZ" };          // three-letter index code shown before every motif code
const codeOf = o => IX3[o.x] + " " + o.c;
// Edges are coloured by SOURCE index; the method sets the line style instead.
// Confirmed cross-walk = solid + arrow; each suggestion type = its own dash.
const METH = {
  constituent:{label:"ATU constituent → TMI"},
  defining:{label:"ATU defining → TMI"},
  note:{label:"TMI notes → ATU"},
  summary:{label:"ATU summary → TMI"},
  berezkin:{label:"Berezkin → ATU, TMI"},
  seealso:{label:"TMI, Berezkin see-also"},
  combo:{label:"ATU combined with"},
  subtype:{label:"ATU subtypes"},
  // dash density follows the checkbox order (inferred → … → semantic):
  // long dashes at the top grading to a fine dotted line at the bottom.
  inferred:{label:"inferred triangles", dash:[10,4], sug:true},
  reasoned:{label:"reasoned / curated", dash:[7,4], sug:true},
  near:{label:"near-identical", dash:[5,3], sug:true},
  lexical:{label:"lexical parallel", dash:[3,3], sug:true},
  semantic:{label:"semantic parallel", dash:[1.5,3], sug:true},
};
let enabledConf = new Set(["constituent","defining","note","summary","berezkin"]);  // confirmed cross-walk
let enabledIntra = new Set(["seealso","combo"]);            // intra-index; subtypes off by default
let enabledSug = new Set(["near","reasoned","inferred"]);   // suggestion layers shown
const edgeOn = m => enabledConf.has(m) || enabledIntra.has(m) || enabledSug.has(m);
// cluster colours (dense-community highlight)
const CPAL = ["#e6194b","#3cb44b","#4363d8","#f58231","#911eb4","#1f9e9e","#f032e6","#9a6324",
              "#008080","#800000","#808000","#000075","#d9a300","#8a5a44","#5a7d5a","#7a4fa3"];
const clColor = id => id>=0 ? CPAL[id % CPAL.length] : "#c9ced6";
let highlightCluster = -1;
// four clustering presets (cumulative edge sets), precomputed in data.js
let clPreset = 0, clMap = new Map();
const clusterList = () => (DATA.clusterings[clPreset]||{clusters:[]}).clusters;
const nodeCl = n => (n.cl && n.cl[clPreset] != null) ? n.cl[clPreset] : -1;
function setClustering(i){ clPreset=i; clMap = new Map(clusterList().map(c=>[c.id,c])); highlightCluster=-1; }
setClustering(0);
const byId = new Map(DATA.nodes.map(n => [n.id, n]));
const adj = new Map();                       // id -> [{o, m}]
for (const n of DATA.nodes) adj.set(n.id, []);
for (const e of DATA.edges) { adj.get(e.s).push({o:e.t,m:e.m}); adj.get(e.t).push({o:e.s,m:e.m}); }
const gdeg = new Map(DATA.nodes.map(n => [n.id, adj.get(n.id).length]));

const cv = document.getElementById("cv"), ctx = cv.getContext("2d");
const tip = document.getElementById("tip");
let DPR = Math.min(2, window.devicePixelRatio || 1);
function resize(){ cv.width = cv.clientWidth*DPR; cv.height = cv.clientHeight*DPR;
  ctx.setTransform(DPR,0,0,DPR,0,0); }
window.addEventListener("resize", resize); resize();

// ---- view state ----
const TAU = Math.PI*2;
let view = { x: cv.clientWidth/2, y: cv.clientHeight/2, k: 1 };
let sub = { nodes: [], edges: [] };   // current rendered subgraph
let focusId = null;
let layoutMode = "force", alpha = 0;   // 1-hop = force sim · 2-hop = concentric rings
let currentCluster = -1;               // >=0 when showing a whole cluster subgraph
let minDeg = 1;                        // degree filter — hide nodes with fewer total links
let posCache = null;                   // id → last {px,py,vx,vy}, carried across a thin-out change
                                       // so filtering keeps the settled layout instead of restarting it

// Deterministic concentric ego-layout: centre → ring1 (direct links, grouped into
// arcs per index) → ring2 (2-hop, ordered by their parents' angle). No force sim,
// so a big hub's neighbourhood lays out cleanly instead of a jittering hairball.
function buildSub(centerId){
  const depth2 = document.getElementById("depth2").checked;
  const nbr = id => (adj.get(id)||[]).filter(x => edgeOn(x.m)).map(x=>x.o);
  const cx = cv.clientWidth/2, cy = cv.clientHeight/2;
  focusId = centerId; currentCluster = -1;
  const f = byId.get(centerId);
  highlightCluster = nodeCl(f);   // focus a node → highlight its cluster

  const ring1 = [...new Set(nbr(centerId))].filter(o => o !== centerId && gdeg.get(o) >= minDeg);
  const ring1set = new Set(ring1);
  const pos = new Map([[centerId, {x:cx, y:cy}]]);
  const angle1 = new Map();
  let R1 = 0, R2 = 0;

  // ring1 in per-index arcs (tmi, atu, brz), evenly spaced, starting at the top.
  const groups = ["tmi","atu","brz"].map(x => ring1.filter(id => byId.get(id).x===x));
  // Cap the seed ring so a big hub doesn't start its neighbours far out — that
  // large a radius yanks the link springs hard on the first frames.
  R1 = Math.min(Math.min(cx,cy)*0.58, Math.max(140, ring1.length*20/TAU + 60));
  const nGroups = groups.filter(g=>g.length).length;
  const gap = 0.22, usable = TAU - gap*nGroups;
  let a0 = -Math.PI/2;
  for (const g of groups){
    if (!g.length) continue;
    const span = usable * (g.length/ring1.length);
    g.forEach((id,i)=>{
      const th = a0 + (g.length===1 ? span/2 : span*i/(g.length-1));
      angle1.set(id, th);
      pos.set(id, {x:cx+Math.cos(th)*R1, y:cy+Math.sin(th)*R1});
    });
    a0 += span + gap;
  }

  // ring2 on an outer ring, ordered by the circular mean of their ring1 parents.
  let ring2 = [];
  if (depth2){
    const seen = new Set([centerId, ...ring1]), r2 = new Set();
    for (const r of ring1) for (const o of nbr(r)) if (!seen.has(o)) r2.add(o);
    ring2 = [...r2].filter(o => gdeg.get(o) >= minDeg);
    const baseAngle = id => {
      let sx=0, sy=0;
      for (const o of nbr(id)) if (angle1.has(o)) { sx+=Math.cos(angle1.get(o)); sy+=Math.sin(angle1.get(o)); }
      return Math.atan2(sy, sx);
    };
    ring2.sort((p,q)=>baseAngle(p)-baseAngle(q));
    R2 = R1 + Math.max(120, ring2.length*15/TAU + 50);
    ring2.forEach((id,i)=>{
      const th = -Math.PI/2 + TAU*(i+0.5)/ring2.length;
      pos.set(id, {x:cx+Math.cos(th)*R2, y:cy+Math.sin(th)*R2});
    });
  }

  // 1-hop → force sim (seeded at the ring positions); 2-hop → bloom to concentric targets.
  const useForce = !depth2;
  const nodes = [...pos.keys()].map(id => { const p = pos.get(id);
    const c = posCache && posCache.get(id);   // kept node → resume its current position
    return Object.assign({}, byId.get(id),
      { tx:p.x, ty:p.y,
        px: c ? c.px : (useForce?p.x:cx), py: c ? c.py : (useForce?p.y:cy),
        vx: c ? c.vx : 0, vy: c ? c.vy : 0, pinned:false }); });
  const nmap = new Map(nodes.map(n=>[n.id,n]));
  const seen = new Set(), edges = [];
  for (const e of DATA.edges) {
    if (!nmap.has(e.s) || !nmap.has(e.t)) continue;
    if (!edgeOn(e.m)) continue;
    const key = e.s<e.t?e.s+e.t:e.t+e.s; if (seen.has(key)) continue; seen.add(key);
    edges.push({ a:nmap.get(e.s), b:nmap.get(e.t), m:e.m, d:e.d, w:e.w });
  }
  // drop nodes left with no shown edge (the degree filter can strip a node's only
  // shown neighbours); keep the focus so it never vanishes.
  const conn = new Set(); for (const e of edges){ conn.add(e.a.id); conn.add(e.b.id); }
  sub = { nodes: nodes.filter(n => n.id===centerId || conn.has(n.id)), edges };
  layoutMode = useForce ? "force" : "concentric"; alpha = useForce ? 1 : 0;

  // Fit the whole neighbourhood into the viewport.
  const maxR = (ring2.length ? R2 : R1) + 44;
  const fit = ring1.length ? Math.min(cv.clientWidth, cv.clientHeight)/2 / maxR : 1;
  view = { x: cx, y: cy, k: Math.max(0.25, Math.min(1.4, fit)) };

  const linked = gdeg.get(centerId);
  // Count the edges actually drawn (center↔neighbour *and* neighbour↔neighbour),
  // so the number matches the lines on screen — not just the direct-neighbour count.
  const shown = sub.edges.length;
  const detail = !linked ? "no links (isolated)"
    : `${shown} link${shown!==1?"s":""} · ${ring1.length} direct`
      + (depth2 ? ` · +${ring2.length} nodes at 2-hop` : "");
  const ci = clMap.get(nodeCl(f));
  const clLine = ci ? `<div class="fi-d fi-cl" data-cl="${ci.id}" style="color:${clColor(ci.id)};`+
    `cursor:pointer;text-decoration:underline;text-underline-offset:2px">◆ cluster of ${ci.size} `+
    `(${DATA.clusterings[clPreset].label})</div>` : "";
  document.getElementById("focusinfo").innerHTML =
    `<div class="fi-id" style="color:${IDX[f.x].c}">${codeOf(f)}</div>`+
    `<div class="fi-n">${escapeHtml(f.n)}</div>`+
    `<div class="fi-d">${IDX[f.x].label} · ${detail}</div>${clLine}`;
}

// Show a whole dense cluster: all its member nodes + the (enabled) links between
// them, force-laid-out — instead of one node's neighbourhood rays.
const CLUSTER_CAP = 500;
function buildCluster(cid){
  const ci = clMap.get(cid); if (!ci) return;
  const cx = cv.clientWidth/2, cy = cv.clientHeight/2;
  focusId = null; currentCluster = cid; highlightCluster = -1;
  let mem = DATA.nodes.filter(n => nodeCl(n)===cid && gdeg.get(n.id) >= minDeg);
  const truncated = mem.length > CLUSTER_CAP;
  if (truncated) mem = [...mem].sort((a,b)=>gdeg.get(b.id)-gdeg.get(a.id)).slice(0, CLUSTER_CAP);
  const R = Math.min(cx,cy)*0.55;
  const nodes = mem.map((n,i)=>{ const th=TAU*i/mem.length;
    const c = posCache && posCache.get(n.id);   // kept node → resume its current position
    return Object.assign({}, n, { tx:cx, ty:cy,
      px: c ? c.px : cx+Math.cos(th)*R, py: c ? c.py : cy+Math.sin(th)*R,
      vx: c ? c.vx : 0, vy: c ? c.vy : 0, pinned:false }); });
  const nmap = new Map(nodes.map(n=>[n.id,n]));
  const seen = new Set(), edges = [];
  for (const e of DATA.edges){
    if (!nmap.has(e.s) || !nmap.has(e.t) || !edgeOn(e.m)) continue;
    const key = e.s<e.t?e.s+e.t:e.t+e.s; if (seen.has(key)) continue; seen.add(key);
    edges.push({ a:nmap.get(e.s), b:nmap.get(e.t), m:e.m, d:e.d, w:e.w });
  }
  const conn = new Set(); for (const e of edges){ conn.add(e.a.id); conn.add(e.b.id); }
  sub = { nodes: nodes.filter(n => conn.has(n.id)), edges }; layoutMode = "force"; alpha = 1;
  view = { x:cx, y:cy, k:0.9 };
  const col = clColor(cid), by = ci.by_index;
  document.getElementById("focusinfo").innerHTML =
    `<div class="fi-id" style="color:${col}">◆ Cluster of ${ci.size}</div>`+
    `<div class="fi-n">${escapeHtml(ci.top.map(codeOf).join(" · "))}</div>`+
    `<div class="fi-d">${DATA.clusterings[clPreset].label}${truncated?` · ${CLUSTER_CAP} densest shown`:""} · ${edges.length} internal links</div>`+
    `<div class="fi-d">nodes: ${by.tmi} TMI · ${by.atu} ATU · ${by.brz} Brz</div>`;
}
// clicking the cluster line in the focus panel jumps to the whole-cluster view
document.getElementById("focusinfo").addEventListener("click", e=>{
  const el = e.target.closest(".fi-cl"); if (!el) return;
  buildCluster(+el.dataset.cl);
});
// re-run whichever view is active (cluster subgraph or a node's neighbourhood)
function rebuild(){ if (currentCluster>=0) buildCluster(currentCluster); else if (focusId) buildSub(focusId); updateFbNote(); }
function updateFbNote(){ const el=document.getElementById("fbnote");
  if (el) el.textContent = `${sub.nodes.length} node${sub.nodes.length!==1?"s":""} shown`; }

// ---- animation ----
// 1-hop: a light force sim (repulsion + link springs + centre gravity, focus pinned).
// 2-hop: deterministic concentric rings (ease each node toward its target).
function forceStep(){
  const ns=sub.nodes, cx=cv.clientWidth/2, cy=cv.clientHeight/2;
  const REP=8000, SPRING=0.035, LINK=64, GRAV=0.02, DAMP=0.86;
  for (const n of ns){ n.fx=(cx-n.px)*GRAV; n.fy=(cy-n.py)*GRAV; }
  for (let i=0;i<ns.length;i++){ const a=ns[i];
    for (let j=i+1;j<ns.length;j++){ const b=ns[j];
      let dx=a.px-b.px, dy=a.py-b.py, d2=dx*dx+dy*dy; if(d2<1)d2=1;
      const f=REP/(d2*Math.sqrt(d2)); const fx=dx*f, fy=dy*f;
      a.fx+=fx; a.fy+=fy; b.fx-=fx; b.fy-=fy; } }
  for (const e of sub.edges){ const a=e.a,b=e.b; let dx=b.px-a.px,dy=b.py-a.py,d=Math.hypot(dx,dy)||1;
    const f=(d-LINK)*SPRING, ux=dx/d, uy=dy/d;
    a.fx+=ux*f; a.fy+=uy*f; b.fx-=ux*f; b.fy-=uy*f; }
  for (const n of ns){
    if (n.id===focusId){ n.px=cx; n.py=cy; n.vx=n.vy=0; continue; }
    if (n===dragNode) continue;
    n.vx=(n.vx+n.fx)*DAMP; n.vy=(n.vy+n.fy)*DAMP;
    n.px+=n.vx*alpha; n.py+=n.vy*alpha;
  }
  if (alpha>0.03) alpha*=0.985;
}
function tick(){
  if (layoutMode==="force") forceStep();
  else for (const n of sub.nodes){ if (n===dragNode||n.pinned) continue;
    n.px += (n.tx-n.px)*0.2; n.py += (n.ty-n.py)*0.2; }
  draw();
  requestAnimationFrame(tick);
}

function toScreen(n){ return { x:(n.px-cv.clientWidth/2)*view.k+view.x, y:(n.py-cv.clientHeight/2)*view.k+view.y }; }
function nodeR(n){ return (n.id===focusId?10:4+Math.min(8,Math.sqrt(gdeg.get(n.id))*1.2))*Math.sqrt(view.k); }

function draw(){
  ctx.clearRect(0,0,cv.clientWidth,cv.clientHeight);
  for (const e of sub.edges){
    const A=toScreen(e.a), B=toScreen(e.b), m=METH[e.m], col=IDX[e.a.x].c;  // colour = source index
    ctx.beginPath(); ctx.moveTo(A.x,A.y); ctx.lineTo(B.x,B.y);
    // opacity: confirmed links solid-ish; suggestions fade with their confidence.
    const op = m.sug ? 0.12 + 0.68*(e.w ?? 0.5) : 0.78;
    ctx.strokeStyle=col; ctx.lineWidth=m.sug?1:1.3;
    ctx.setLineDash(m.dash||[]); ctx.globalAlpha=op; ctx.stroke();
    // Arrowhead at the target end (just outside its node) — confirmed links only.
    if (e.d){
      const ang=Math.atan2(B.y-A.y, B.x-A.x), rB=nodeR(e.b), sz=Math.max(4.5,6*Math.sqrt(view.k));
      if (Math.hypot(B.x-A.x, B.y-A.y) > rB+sz+2){
        const tx=B.x-Math.cos(ang)*(rB+1.5), ty=B.y-Math.sin(ang)*(rB+1.5);
        ctx.setLineDash([]); ctx.beginPath(); ctx.moveTo(tx,ty);
        ctx.lineTo(tx-Math.cos(ang-0.45)*sz, ty-Math.sin(ang-0.45)*sz);
        ctx.lineTo(tx-Math.cos(ang+0.45)*sz, ty-Math.sin(ang+0.45)*sz);
        ctx.closePath(); ctx.globalAlpha=.9; ctx.fillStyle=col; ctx.fill();
      }
    }
  }
  ctx.setLineDash([]); ctx.globalAlpha=1;
  const hc = highlightCluster;
  for (const n of sub.nodes){
    const P=toScreen(n), r=nodeR(n);
    // dense-cluster halo for members of the highlighted community
    if (hc>=0 && nodeCl(n)===hc){
      ctx.beginPath(); ctx.arc(P.x,P.y,r+3.5,0,7);
      ctx.strokeStyle=clColor(hc); ctx.lineWidth=2.5; ctx.globalAlpha=.9; ctx.stroke(); ctx.globalAlpha=1;
    }
    ctx.beginPath(); ctx.arc(P.x,P.y,r,0,7); ctx.fillStyle=IDX[n.x].c;
    ctx.strokeStyle=n.id===focusId?"#111":"#fff"; ctx.lineWidth=n.id===focusId?2.5:1.4;
    ctx.fill(); ctx.stroke();
    if (n.id===focusId || view.k>1.1 || sub.nodes.length<26){
      ctx.fillStyle="#111827"; ctx.font=`${n.id===focusId?12:10}px -apple-system,sans-serif`;
      ctx.textAlign="center"; ctx.fillText(codeOf(n), P.x, P.y-r-3);
    }
  }
}

// ---- interaction ----
let dragNode=null, panning=false, last=null, moved=false;
let suppressTipFor=null;   // a just-released node: keep its tooltip hidden until the pointer clears it
function pick(mx,my){
  for (let i=sub.nodes.length-1;i>=0;i--){ const P=toScreen(sub.nodes[i]);
    const r=(sub.nodes[i].id===focusId?9:6)*Math.sqrt(view.k)+3;
    if ((mx-P.x)**2+(my-P.y)**2 < r*r) return sub.nodes[i]; }
  return null;
}
cv.addEventListener("mousedown", e=>{ const n=pick(e.offsetX,e.offsetY); moved=false;
  if(n){ dragNode=n; } else { panning=true; cv.classList.add("drag"); } last=[e.offsetX,e.offsetY]; });
function showTip(n, sx, sy){
  const def = n.d ? `<div style="margin-top:5px;padding-top:5px;border-top:1px solid rgba(255,255,255,.18);opacity:.9;white-space:normal;line-height:1.4">${escapeHtml(n.d)}</div>` : "";
  tip.innerHTML=`<b>${codeOf(n)}</b> — ${escapeHtml(n.n)}<br><span style="opacity:.7">${IDX[n.x].label} · ${gdeg.get(n.id)} links</span>${def}`;
  tip.style.display="block"; tip.style.left=(sx+14)+"px"; tip.style.top=(sy+10)+"px";
}
cv.addEventListener("mousemove", e=>{
  if (dragNode){ const dx=(e.offsetX-last[0])/view.k, dy=(e.offsetY-last[1])/view.k;
    dragNode.px+=dx; dragNode.py+=dy; dragNode.vx=0; dragNode.vy=0; last=[e.offsetX,e.offsetY]; moved=true; alpha=Math.max(alpha,.3);
    const P=toScreen(dragNode); showTip(dragNode, P.x, P.y); return; }   // tooltip follows the node
  if (panning){ view.x+=e.offsetX-last[0]; view.y+=e.offsetY-last[1]; last=[e.offsetX,e.offsetY]; moved=true; return; }
  const n=pick(e.offsetX,e.offsetY);
  // A node just released under the cursor keeps drifting there; don't flash its
  // tooltip back until the pointer has moved off it at least once.
  if (suppressTipFor){ if (n===suppressTipFor){ tip.style.display="none"; cv.style.cursor="pointer"; return; } suppressTipFor=null; }
  if (n){ showTip(n, e.offsetX, e.offsetY); cv.style.cursor="pointer"; }
  else { tip.style.display="none"; cv.style.cursor=panning?"grabbing":"grab"; }
});
window.addEventListener("mouseup", e=>{
  if (dragNode && !moved) buildSub(dragNode.id);   // click (no drag) = recentre
  if (dragNode){ tip.style.display="none";         // released node drifts off — drop its tooltip
    if (moved) suppressTipFor=dragNode; }          // and keep it hidden until the pointer leaves it
  dragNode=null; panning=false; cv.classList.remove("drag");
});
cv.addEventListener("wheel", e=>{ e.preventDefault(); const f=e.deltaY<0?1.1:1/1.1;
  const mx=e.offsetX,my=e.offsetY; view.x=mx-(mx-view.x)*f; view.y=my-(my-view.y)*f; view.k*=f; }, {passive:false});
document.getElementById("depth2").addEventListener("change", rebuild);
// degree filter — thin the current view by hiding low-degree nodes
const degFilter=document.getElementById("degFilter"), fbval=document.getElementById("fbval");
degFilter.addEventListener("input", ()=>{
  minDeg=+degFilter.value; fbval.textContent=minDeg;
  // Keep the settled layout: carry current node positions into the rebuild and
  // hold the current zoom/pan, so thinning only drops/adds nodes in place.
  posCache = new Map(sub.nodes.map(n=>[n.id,{px:n.px,py:n.py,vx:n.vx,vy:n.vy}]));
  const v = view;
  rebuild();
  view = v;
  posCache = null;
  if (layoutMode==="force") alpha = 0.3;   // gentle re-settle for new nodes, not a full restart
});
// ---- combined panel: node legend + edge legend swatches merged with the toggles ----
const swLine = m => `<svg class="sw" width="20" height="7"><line x1="0" y1="3.5" x2="20" y2="3.5" `+
  `stroke="#8a94a6" stroke-width="2"${m.dash?` stroke-dasharray="${m.dash.join(' ')}"`:''}/></svg>`;
document.getElementById("nodeleg").innerHTML =
  `<div class="ctl-h" style="border-top:0">Node — index</div>`+
  Object.values(IDX).map(v=>`<div class="row"><span class="dot" style="background:${v.c}"></span>${v.label}</div>`).join("");
const LAYERS = [
  {cls:"conf", master:"confAll", title:"Confirmed cross-walk", items:["constituent","defining","summary","note","berezkin"], on:["constituent","defining","note","summary","berezkin"]},
  {cls:"intra", master:"intraAll", title:"Intra-index links", items:["seealso","combo","subtype"], on:["seealso","combo"]},
  {cls:"sug", master:"sugAll", title:"Suggestion layers", items:["inferred","reasoned","near","lexical","semantic"], on:["near","reasoned","inferred"]},
];
document.getElementById("layers").innerHTML = LAYERS.map(g=>
  `<label class="ctl-h grp"><input type="checkbox" id="${g.master}"> ${g.title} — all</label>`+
  g.items.map(v=>`<label class="det"><input type="checkbox" class="${g.cls}" value="${v}"${g.on.includes(v)?" checked":""}>`+
    `${swLine(METH[v])}<span class="lbl">${METH[v].label}</span></label>`).join("")
).join("");

// a checkbox group with a master "— all" toggle (mixed state → indeterminate)
function makeGroup(masterId, cls, setSet){
  const master = document.getElementById(masterId);
  const boxes = () => document.querySelectorAll("."+cls);
  function apply(){
    const on = [...document.querySelectorAll("."+cls+":checked")];
    setSet(new Set(on.map(c=>c.value)));
    master.checked = on.length===boxes().length; master.indeterminate = on.length>0 && on.length<boxes().length;
    rebuild();
  }
  boxes().forEach(cb=>cb.addEventListener("change", apply));
  master.addEventListener("change", ()=>{ boxes().forEach(c=>c.checked=master.checked); apply(); });
  apply();   // sync the master's initial (possibly indeterminate) state
}
makeGroup("confAll", "conf", s=>enabledConf=s);
makeGroup("intraAll", "intra", s=>enabledIntra=s);
makeGroup("sugAll", "sug", s=>enabledSug=s);

// ---- search ----
const search=document.getElementById("search"), results=document.getElementById("results");
search.addEventListener("input", ()=>{
  const q=search.value.trim().toLowerCase(); if(q.length<2){results.style.display="none";return;}
  const hits=DATA.nodes.filter(n=>n.c.toLowerCase().startsWith(q)||n.n.toLowerCase().includes(q))
    .sort((a,b)=>gdeg.get(b.id)-gdeg.get(a.id)).slice(0,40);
  results.innerHTML=hits.map(n=>`<div data-id="${n.id}"><span class="rid" style="color:${IDX[n.x].c}">${codeOf(n)}</span> — ${escapeHtml(n.n)} <span style="color:#9299a1">(${gdeg.get(n.id)})</span></div>`).join("")||`<div style="color:#9299a1">no matches</div>`;
  results.style.display="block";
});
results.addEventListener("click", e=>{ const d=e.target.closest("[data-id]"); if(!d)return;
  buildSub(d.dataset.id); results.style.display="none"; search.value=""; });
document.addEventListener("click", e=>{ if(!results.contains(e.target)&&e.target!==search) results.style.display="none"; });

// ---- browse: discover entry points (most-linked hubs) or dense clusters ----
const hubsSorted = [...DATA.nodes].sort((a,b)=>gdeg.get(b.id)-gdeg.get(a.id));
const browse=document.getElementById("browse"), blist=document.getElementById("blist"), bhead=document.getElementById("bhead");
const bfilter=document.getElementById("bfilter"), bvariant=document.getElementById("bvariant");
let browseMode="hubs", browseFilter="";
function renderBrowse(){
  bfilter.style.display = browseMode==="hubs" ? "flex" : "none";
  bvariant.style.display = browseMode==="clusters" ? "block" : "none";
  if (browseMode==="clusters"){
    const cls = clusterList();
    bhead.textContent = `${cls.length.toLocaleString()} dense cluster${cls.length!==1?"s":""} · `
      + `${DATA.clusterings[clPreset].label} · biggest first`;
    blist.innerHTML = cls.slice(0,150).map(c=>{
      const lab = c.top.map(t=>`<span style="color:${IDX[t.x].c}">${escapeHtml(codeOf(t))}</span>`).join(" · ");
      const tot = c.by_index.tmi+c.by_index.atu+c.by_index.brz || 1;
      const bar = ["tmi","atu","brz"].map(x=>c.by_index[x]?`<i style="width:${100*c.by_index[x]/tot}%;background:${IDX[x].c}"></i>`:"").join("");
      return `<div data-cl="${c.id}"><span class="dot" style="background:${clColor(c.id)}"></span>`+
        `<span class="cl-lab">${lab}</span><span class="comp">${bar}</span><span class="bd">${c.size}</span></div>`;
    }).join("");
  } else {
    const all = browseFilter ? hubsSorted.filter(n=>n.x===browseFilter) : hubsSorted;
    const shown = all.slice(0, 150);
    bhead.textContent = `${all.length.toLocaleString()} connected node${all.length!==1?"s":""} · most-linked first`
      + (all.length>shown.length ? ` (top ${shown.length})` : "");
    blist.innerHTML = shown.map(n=>
      `<div data-id="${n.id}"><span class="dot" style="background:${IDX[n.x].c}"></span>`+
      `<span class="rid" style="color:${IDX[n.x].c}">${codeOf(n)}</span>`+
      `<span class="bn">${escapeHtml(n.n)}</span><span class="bd">${gdeg.get(n.id)}</span></div>`).join("");
  }
}
const browseBtn = document.getElementById("browseBtn");
function hideBrowse(){ browse.style.display="none"; browseBtn.classList.remove("on"); }
browseBtn.addEventListener("click", ()=>{
  const open = browse.style.display!=="flex"; browse.style.display=open?"flex":"none";
  browseBtn.classList.toggle("on", open); if(open) renderBrowse();
});

// ---- export the full graph (with the currently enabled layers) to Cosmograph ----
function csvCell(v){ v = String(v ?? ""); return /[",\n]/.test(v) ? '"'+v.replace(/"/g,'""')+'"' : v; }
function downloadCsv(name, text){
  const url = URL.createObjectURL(new Blob([text], {type:"text/csv"}));
  const a = document.createElement("a"); a.href=url; a.download=name; document.body.appendChild(a); a.click();
  a.remove(); setTimeout(()=>URL.revokeObjectURL(url), 1000);
}
function exportCosmograph(){
  const links = DATA.edges.filter(e => edgeOn(e.m));
  const ids = new Set(), deg = {};
  for (const e of links){ ids.add(e.s); ids.add(e.t); deg[e.s]=(deg[e.s]||0)+1; deg[e.t]=(deg[e.t]||0)+1; }
  let lcsv = "source,target,type,confidence\n";
  for (const e of links) lcsv += `${csvCell(e.s)},${csvCell(e.t)},${e.m},${e.w ?? 1}\n`;
  let ncsv = "id,label,name,index,cluster,degree\n";
  for (const n of DATA.nodes){ if(!ids.has(n.id)) continue;
    ncsv += `${csvCell(n.id)},${csvCell(codeOf(n))},${csvCell(n.n)},${n.x},${nodeCl(n)},${deg[n.id]||0}\n`; }
  downloadCsv("cosmograph-links.csv", lcsv);
  setTimeout(()=>downloadCsv("cosmograph-nodes.csv", ncsv), 400);   // stagger the two downloads
  const btn = document.getElementById("exportBtn");
  btn.textContent = `✓ ${ids.size.toLocaleString()} nodes · ${links.length.toLocaleString()} links`;
  setTimeout(()=>{ btn.textContent = "↓ Cosmograph"; }, 2600);
}
document.getElementById("exportBtn").addEventListener("click", exportCosmograph);
document.querySelectorAll(".bmode button").forEach(b=>b.addEventListener("click", ()=>{
  document.querySelectorAll(".bmode button").forEach(x=>x.classList.remove("active"));
  b.classList.add("active"); browseMode=b.dataset.mode; renderBrowse();
}));
bfilter.querySelectorAll("button").forEach(b=>b.addEventListener("click", ()=>{
  bfilter.querySelectorAll("button").forEach(x=>x.classList.remove("active"));
  b.classList.add("active"); browseFilter=b.dataset.x; renderBrowse();
}));
const clsel=document.getElementById("clsel");
clsel.innerHTML = DATA.clusterings.map((c,i)=>`<option value="${i}">${escapeHtml(c.label)}</option>`).join("");
clsel.addEventListener("change", ()=>{ setClustering(+clsel.value); currentCluster=-1; renderBrowse();
  if (focusId) buildSub(focusId);   // refresh the on-canvas cluster highlight
});
blist.addEventListener("click", e=>{
  const dc=e.target.closest("[data-cl]");
  if (dc){ buildCluster(+dc.dataset.cl); hideBrowse(); return; }
  const d=e.target.closest("[data-id]"); if(!d)return; buildSub(d.dataset.id); hideBrowse(); });
document.addEventListener("click", e=>{ if(!browse.contains(e.target)&&e.target!==browseBtn) hideBrowse(); });

function escapeHtml(s){ return (s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

buildSub("atu:875");   // seed on the busiest hub
updateFbNote();
tick();
</script>
