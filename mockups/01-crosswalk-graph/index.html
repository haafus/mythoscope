<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cross-walk graph — mockup</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
         color: #212529; background: #faf9f5; }
  header { padding: 12px 18px; border-bottom: 1px solid #dee2e6; background: #fff;
           display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  header h1 { font-size: 15px; margin: 0; font-weight: 700; }
  header .sub { color: #6c757d; font-size: 12px; }
  #search { flex: 1 1 260px; max-width: 420px; padding: 7px 10px; font-size: 13px;
            border: 1px solid #dee2e6; border-radius: 6px; }
  #results { position: absolute; z-index: 20; background: #fff; border: 1px solid #dee2e6;
             border-radius: 6px; max-height: 300px; overflow-y: auto; box-shadow: 0 4px 14px rgba(0,0,0,.08);
             display: none; min-width: 320px; }
  #results div { padding: 6px 10px; font-size: 12.5px; cursor: pointer; border-bottom: 1px solid #f1f3f5; }
  #results div:hover { background: #eef4fb; }
  #results .rid { font-weight: 700; }
  main { position: relative; height: calc(100vh - 52px); }
  canvas { display: block; width: 100%; height: 100%; cursor: grab; }
  canvas.drag { cursor: grabbing; }
  .legend { position: absolute; bottom: 14px; left: 14px; background: rgba(255,255,255,.94);
            border: 1px solid #dee2e6; border-radius: 8px; padding: 10px 12px; font-size: 11.5px; }
  .legend b { display: block; margin: 6px 0 3px; color: #6c757d; font-weight: 600;
              text-transform: uppercase; font-size: 9.5px; letter-spacing: .04em; }
  .legend .row { display: flex; align-items: center; gap: 6px; margin: 2px 0; }
  .dot { width: 10px; height: 10px; border-radius: 50%; }
  .ln { width: 16px; height: 0; border-top: 3px solid; }
  .tip { position: absolute; z-index: 30; pointer-events: none; background: #111827; color: #fff;
         padding: 5px 9px; border-radius: 6px; font-size: 12px; max-width: 280px; display: none; }
  .ctl { position: absolute; top: 12px; right: 12px; background: rgba(255,255,255,.94);
         border: 1px solid #dee2e6; border-radius: 8px; padding: 8px 10px; font-size: 12px; }
  .ctl label { display: block; margin: 3px 0; cursor: pointer; }
  .focusinfo { position: absolute; top: 12px; left: 12px; background: rgba(255,255,255,.94);
               border: 1px solid #dee2e6; border-radius: 8px; padding: 8px 11px; font-size: 12px; max-width: 300px; }
  .focusinfo .fi-id { font-weight: 700; }
  .focusinfo .fi-n { color: #374151; }
  .focusinfo .fi-d { color: #6c757d; font-size: 11px; margin-top: 2px; }
  .btn { padding: 7px 12px; font-size: 12.5px; border: 1px solid #dee2e6; border-radius: 6px;
         background: #fff; cursor: pointer; white-space: nowrap; }
  .btn:hover { background: #eef4fb; }
  #browse { position: absolute; z-index: 25; top: 60px; right: 12px; width: 344px; max-height: 74vh;
            background: #fff; border: 1px solid #dee2e6; border-radius: 8px;
            box-shadow: 0 6px 20px rgba(0,0,0,.1); display: none; flex-direction: column; }
  #browse .bhead { padding: 8px 10px 6px; font-size: 11px; color: #6c757d; border-bottom: 1px solid #f1f3f5; }
  .bfilter { display: flex; gap: 4px; padding: 7px 8px; border-bottom: 1px solid #f1f3f5; }
  .bfilter button { flex: 1; padding: 5px 4px; font-size: 11.5px; border: 1px solid #dee2e6;
                    border-radius: 5px; background: #fff; cursor: pointer; }
  .bfilter button.active { background: #111827; color: #fff; border-color: #111827; }
  #blist { overflow-y: auto; }
  #blist div { padding: 6px 10px; font-size: 12.5px; cursor: pointer; border-bottom: 1px solid #f6f7f8;
               display: flex; gap: 7px; align-items: baseline; }
  #blist div:hover { background: #eef4fb; }
  #blist .bn { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #blist .bd { color: #9299a1; font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<header>
  <h1>Cross-walk graph</h1>
  <span class="sub">click a node to recentre · drag to move · scroll to zoom · arrows show link direction</span>
  <input id="search" placeholder="Search a motif / type (id or name)…" autocomplete="off">
  <button id="browseBtn" class="btn">☰ Browse hubs</button>
</header>
<main>
  <canvas id="cv"></canvas>
  <div id="results"></div>
  <div id="browse">
    <div class="bhead" id="bhead"></div>
    <div class="bfilter">
      <button data-x="" class="active">All</button>
      <button data-x="tmi">TMI</button>
      <button data-x="atu">ATU</button>
      <button data-x="brz">Berezkin</button>
    </div>
    <div id="blist"></div>
  </div>
  <div class="tip" id="tip"></div>
  <div class="focusinfo" id="focusinfo"></div>
  <div class="ctl">
    <label><input type="checkbox" id="depth2"> 2-hop neighbourhood</label>
    <label><input type="checkbox" id="showInferred" checked> show inferred links</label>
  </div>
  <div class="legend" id="legend"></div>
</main>
<script src="data.js"></script>
<script>
const IDX = { tmi:{c:"#2a9d8f",label:"Thompson (TMI)"}, atu:{c:"#3a6ea5",label:"ATU type"}, brz:{c:"#b5651d",label:"Berezkin"} };
const METH = {
  constituent:{c:"#8a94a6",label:"constituent (atu_seq)"},
  defining:{c:"#2a9d8f",label:"defining motif"},
  note:{c:"#c77dff",label:"TMI note ⇒ ATU"},
  summary:{c:"#e07a5f",label:"ATU summary ⇒ TMI"},
  berezkin:{c:"#3d5a80",label:"Berezkin citation"},
  inferred:{c:"#c9ced6",label:"inferred (triangle)",dash:true},
};
const byId = new Map(DATA.nodes.map(n => [n.id, n]));
const adj = new Map();                       // id -> [{o, m}]
for (const n of DATA.nodes) adj.set(n.id, []);
for (const e of DATA.edges) { adj.get(e.s).push({o:e.t,m:e.m}); adj.get(e.t).push({o:e.s,m:e.m}); }
const gdeg = new Map(DATA.nodes.map(n => [n.id, adj.get(n.id).length]));

const cv = document.getElementById("cv"), ctx = cv.getContext("2d");
const tip = document.getElementById("tip");
let DPR = Math.min(2, window.devicePixelRatio || 1);
function resize(){ cv.width = cv.clientWidth*DPR; cv.height = cv.clientHeight*DPR;
  ctx.setTransform(DPR,0,0,DPR,0,0); }
window.addEventListener("resize", resize); resize();

// ---- view state ----
const TAU = Math.PI*2;
let view = { x: cv.clientWidth/2, y: cv.clientHeight/2, k: 1 };
let sub = { nodes: [], edges: [] };   // current rendered subgraph
let focusId = null;

// Deterministic concentric ego-layout: centre → ring1 (direct links, grouped into
// arcs per index) → ring2 (2-hop, ordered by their parents' angle). No force sim,
// so a big hub's neighbourhood lays out cleanly instead of a jittering hairball.
function buildSub(centerId){
  const depth2 = document.getElementById("depth2").checked;
  const showInf = document.getElementById("showInferred").checked;
  const nbr = id => (adj.get(id)||[]).filter(x => showInf || x.m!=="inferred").map(x=>x.o);
  const cx = cv.clientWidth/2, cy = cv.clientHeight/2;
  focusId = centerId;
  const f = byId.get(centerId);

  const ring1 = [...new Set(nbr(centerId))].filter(o => o !== centerId);
  const ring1set = new Set(ring1);
  const pos = new Map([[centerId, {x:cx, y:cy}]]);
  const angle1 = new Map();
  let R1 = 0, R2 = 0;

  // ring1 in per-index arcs (tmi, atu, brz), evenly spaced, starting at the top.
  const groups = ["tmi","atu","brz"].map(x => ring1.filter(id => byId.get(id).x===x));
  R1 = Math.max(150, ring1.length*20/TAU + 60);
  const nGroups = groups.filter(g=>g.length).length;
  const gap = 0.22, usable = TAU - gap*nGroups;
  let a0 = -Math.PI/2;
  for (const g of groups){
    if (!g.length) continue;
    const span = usable * (g.length/ring1.length);
    g.forEach((id,i)=>{
      const th = a0 + (g.length===1 ? span/2 : span*i/(g.length-1));
      angle1.set(id, th);
      pos.set(id, {x:cx+Math.cos(th)*R1, y:cy+Math.sin(th)*R1});
    });
    a0 += span + gap;
  }

  // ring2 on an outer ring, ordered by the circular mean of their ring1 parents.
  let ring2 = [];
  if (depth2){
    const seen = new Set([centerId, ...ring1]), r2 = new Set();
    for (const r of ring1) for (const o of nbr(r)) if (!seen.has(o)) r2.add(o);
    ring2 = [...r2];
    const baseAngle = id => {
      let sx=0, sy=0;
      for (const o of nbr(id)) if (angle1.has(o)) { sx+=Math.cos(angle1.get(o)); sy+=Math.sin(angle1.get(o)); }
      return Math.atan2(sy, sx);
    };
    ring2.sort((p,q)=>baseAngle(p)-baseAngle(q));
    R2 = R1 + Math.max(120, ring2.length*15/TAU + 50);
    ring2.forEach((id,i)=>{
      const th = -Math.PI/2 + TAU*(i+0.5)/ring2.length;
      pos.set(id, {x:cx+Math.cos(th)*R2, y:cy+Math.sin(th)*R2});
    });
  }

  // Nodes bloom out from the centre to their target (px→tx/ty each frame).
  const nodes = [...pos.keys()].map(id => Object.assign({}, byId.get(id),
    { tx:pos.get(id).x, ty:pos.get(id).y, px:cx, py:cy, pinned:false }));
  const nmap = new Map(nodes.map(n=>[n.id,n]));
  const seen = new Set(), edges = [];
  for (const e of DATA.edges) {
    if (!nmap.has(e.s) || !nmap.has(e.t)) continue;
    if (!showInf && e.m==="inferred") continue;
    const key = e.s<e.t?e.s+e.t:e.t+e.s; if (seen.has(key)) continue; seen.add(key);
    edges.push({ a:nmap.get(e.s), b:nmap.get(e.t), m:e.m, d:e.d });
  }
  sub = { nodes, edges };

  // Fit the whole neighbourhood into the viewport.
  const maxR = (ring2.length ? R2 : R1) + 44;
  const fit = ring1.length ? Math.min(cv.clientWidth, cv.clientHeight)/2 / maxR : 1;
  view = { x: cx, y: cy, k: Math.max(0.25, Math.min(1.4, fit)) };

  const linked = gdeg.get(centerId);
  const detail = !linked ? "no cross-walk links (isolated)"
    : `${linked} cross-link${linked>1?"s":""}` + (depth2 ? ` · +${ring2.length} at 2-hop` : "");
  document.getElementById("focusinfo").innerHTML =
    `<div class="fi-id" style="color:${IDX[f.x].c}">${f.c}</div>`+
    `<div class="fi-n">${escapeHtml(f.n)}</div>`+
    `<div class="fi-d">${IDX[f.x].label} · ${detail}</div>`;
}

// ---- animation: ease each node toward its concentric target ----
function tick(){
  for (const n of sub.nodes){
    if (n === dragNode || n.pinned) continue;
    n.px += (n.tx - n.px)*0.2; n.py += (n.ty - n.py)*0.2;
  }
  draw();
  requestAnimationFrame(tick);
}

function toScreen(n){ return { x:(n.px-cv.clientWidth/2)*view.k+view.x, y:(n.py-cv.clientHeight/2)*view.k+view.y }; }
function nodeR(n){ return (n.id===focusId?9:4.5+Math.min(5,Math.sqrt(gdeg.get(n.id))))*Math.sqrt(view.k); }

function draw(){
  ctx.clearRect(0,0,cv.clientWidth,cv.clientHeight);
  for (const e of sub.edges){
    const A=toScreen(e.a), B=toScreen(e.b), m=METH[e.m];
    ctx.beginPath(); ctx.moveTo(A.x,A.y); ctx.lineTo(B.x,B.y);
    ctx.strokeStyle=m.c; ctx.lineWidth=e.m==="constituent"?1:1.4;
    ctx.setLineDash(m.dash?[4,4]:[]); ctx.globalAlpha=.75; ctx.stroke();
    // Arrowhead at the target end (just outside its node), for directed links.
    if (e.d){
      const ang=Math.atan2(B.y-A.y, B.x-A.x), rB=nodeR(e.b), sz=Math.max(4.5,6*Math.sqrt(view.k));
      const dist=Math.hypot(B.x-A.x, B.y-A.y);
      if (dist > rB+sz+2){
        const tx=B.x-Math.cos(ang)*(rB+1.5), ty=B.y-Math.sin(ang)*(rB+1.5);
        ctx.setLineDash([]); ctx.beginPath(); ctx.moveTo(tx,ty);
        ctx.lineTo(tx-Math.cos(ang-0.45)*sz, ty-Math.sin(ang-0.45)*sz);
        ctx.lineTo(tx-Math.cos(ang+0.45)*sz, ty-Math.sin(ang+0.45)*sz);
        ctx.closePath(); ctx.globalAlpha=.9; ctx.fillStyle=m.c; ctx.fill();
      }
    }
  }
  ctx.setLineDash([]); ctx.globalAlpha=1;
  for (const n of sub.nodes){
    const P=toScreen(n), r=nodeR(n);
    ctx.beginPath(); ctx.arc(P.x,P.y,r,0,7); ctx.fillStyle=IDX[n.x].c;
    ctx.strokeStyle=n.id===focusId?"#111":"#fff"; ctx.lineWidth=n.id===focusId?2.5:1.4;
    ctx.fill(); ctx.stroke();
    if (n.id===focusId || view.k>1.1 || sub.nodes.length<26){
      ctx.fillStyle="#111827"; ctx.font=`${n.id===focusId?12:10}px -apple-system,sans-serif`;
      ctx.textAlign="center"; ctx.fillText(n.c, P.x, P.y-r-3);
    }
  }
}

// ---- interaction ----
let dragNode=null, panning=false, last=null, moved=false;
function pick(mx,my){
  for (let i=sub.nodes.length-1;i>=0;i--){ const P=toScreen(sub.nodes[i]);
    const r=(sub.nodes[i].id===focusId?9:6)*Math.sqrt(view.k)+3;
    if ((mx-P.x)**2+(my-P.y)**2 < r*r) return sub.nodes[i]; }
  return null;
}
cv.addEventListener("mousedown", e=>{ const n=pick(e.offsetX,e.offsetY); moved=false;
  if(n){ dragNode=n; } else { panning=true; cv.classList.add("drag"); } last=[e.offsetX,e.offsetY]; });
cv.addEventListener("mousemove", e=>{
  if (dragNode){ const dx=(e.offsetX-last[0])/view.k, dy=(e.offsetY-last[1])/view.k;
    dragNode.px+=dx; dragNode.py+=dy; dragNode.vx=0; dragNode.vy=0; last=[e.offsetX,e.offsetY]; moved=true; alpha=Math.max(alpha,.3); return; }
  if (panning){ view.x+=e.offsetX-last[0]; view.y+=e.offsetY-last[1]; last=[e.offsetX,e.offsetY]; moved=true; return; }
  const n=pick(e.offsetX,e.offsetY);
  if (n){ tip.style.display="block"; tip.style.left=(e.offsetX+14)+"px"; tip.style.top=(e.offsetY+10)+"px";
    tip.innerHTML=`<b>${n.c}</b> — ${escapeHtml(n.n)}<br><span style="opacity:.7">${IDX[n.x].label} · ${gdeg.get(n.id)} links</span>`; cv.style.cursor="pointer"; }
  else { tip.style.display="none"; cv.style.cursor=panning?"grabbing":"grab"; }
});
window.addEventListener("mouseup", e=>{
  if (dragNode && !moved) buildSub(dragNode.id);   // click (no drag) = recentre
  dragNode=null; panning=false; cv.classList.remove("drag");
});
cv.addEventListener("wheel", e=>{ e.preventDefault(); const f=e.deltaY<0?1.1:1/1.1;
  const mx=e.offsetX,my=e.offsetY; view.x=mx-(mx-view.x)*f; view.y=my-(my-view.y)*f; view.k*=f; }, {passive:false});
document.getElementById("depth2").addEventListener("change", ()=>focusId&&buildSub(focusId));
document.getElementById("showInferred").addEventListener("change", ()=>focusId&&buildSub(focusId));

// ---- search ----
const search=document.getElementById("search"), results=document.getElementById("results");
search.addEventListener("input", ()=>{
  const q=search.value.trim().toLowerCase(); if(q.length<2){results.style.display="none";return;}
  const hits=DATA.nodes.filter(n=>n.c.toLowerCase().startsWith(q)||n.n.toLowerCase().includes(q))
    .sort((a,b)=>gdeg.get(b.id)-gdeg.get(a.id)).slice(0,40);
  results.innerHTML=hits.map(n=>`<div data-id="${n.id}"><span class="rid" style="color:${IDX[n.x].c}">${n.c}</span> — ${escapeHtml(n.n)} <span style="color:#9299a1">(${gdeg.get(n.id)})</span></div>`).join("")||`<div style="color:#9299a1">no matches</div>`;
  const r=search.getBoundingClientRect(); results.style.left=r.left+"px"; results.style.top=(r.bottom+4)+"px"; results.style.display="block";
});
results.addEventListener("click", e=>{ const d=e.target.closest("[data-id]"); if(!d)return;
  buildSub(d.dataset.id); results.style.display="none"; search.value=""; });
document.addEventListener("click", e=>{ if(!results.contains(e.target)&&e.target!==search) results.style.display="none"; });

// ---- browse: discover entry points (most-connected nodes, per index) ----
const hubsSorted = [...DATA.nodes].sort((a,b)=>gdeg.get(b.id)-gdeg.get(a.id));
const browse=document.getElementById("browse"), blist=document.getElementById("blist"), bhead=document.getElementById("bhead");
let browseFilter="";
function renderBrowse(){
  const all = browseFilter ? hubsSorted.filter(n=>n.x===browseFilter) : hubsSorted;
  const shown = all.slice(0, 150);
  bhead.textContent = `${all.length.toLocaleString()} connected node${all.length!==1?"s":""} · most-linked first`
    + (all.length>shown.length ? ` (top ${shown.length})` : "");
  blist.innerHTML = shown.map(n=>
    `<div data-id="${n.id}"><span class="dot" style="background:${IDX[n.x].c}"></span>`+
    `<span class="rid" style="color:${IDX[n.x].c}">${n.c}</span>`+
    `<span class="bn">${escapeHtml(n.n)}</span><span class="bd">${gdeg.get(n.id)}</span></div>`).join("");
}
document.getElementById("browseBtn").addEventListener("click", ()=>{
  const open = browse.style.display!=="flex"; browse.style.display=open?"flex":"none"; if(open) renderBrowse();
});
document.querySelectorAll(".bfilter button").forEach(b=>b.addEventListener("click", ()=>{
  document.querySelectorAll(".bfilter button").forEach(x=>x.classList.remove("active"));
  b.classList.add("active"); browseFilter=b.dataset.x; renderBrowse();
}));
blist.addEventListener("click", e=>{ const d=e.target.closest("[data-id]"); if(!d)return;
  buildSub(d.dataset.id); browse.style.display="none"; });
document.addEventListener("click", e=>{ if(!browse.contains(e.target)&&e.target.id!=="browseBtn") browse.style.display="none"; });

function escapeHtml(s){ return (s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

// legend
document.getElementById("legend").innerHTML =
  `<b>Node</b>`+Object.values(IDX).map(v=>`<div class="row"><span class="dot" style="background:${v.c}"></span>${v.label}</div>`).join("")+
  `<b>Link method</b>`+Object.values(METH).map(v=>`<div class="row"><span class="ln" style="border-color:${v.c};${v.dash?'border-top-style:dashed;':''}"></span>${v.label}</div>`).join("");

buildSub("atu:875");   // seed on the busiest hub
tick();
</script>
</body>
</html>
