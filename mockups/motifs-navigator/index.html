<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MythoScope — unified motif navigator (mock)</title>
<!--
  ISOLATED MOCK — not wired into the app. Open this file directly in a browser.
  It demonstrates the design in docs/motifs/motifs-browser-ui.md: one navigator surface
  with composable lenses (search + Tree/List view + chapter + tier filter + sort)
  and a browse/read focus toggle with keyboard stepping. Data is a small real
  slice of the TMI index, embedded below; nothing here calls the live API.
-->
<style>
  :root{
    --acc:#2a9d8f; --acc-d:#1f7a6f; --sun:#e9c46a; --bg:#fbfbf9; --pane:#ffffff;
    --ink:#1d2d2b; --mut:#5a6b69; --line:#e4e7e5; --hi:#fff6da;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:"Segoe UI",system-ui,sans-serif;color:var(--ink);background:var(--bg);font-size:14px}
  .topbar{display:flex;align-items:center;gap:14px;padding:10px 18px;border-bottom:1px solid var(--line);background:var(--pane)}
  .topbar b{font-size:15px}
  .topbar .tag{font-size:11px;color:#fff;background:var(--acc);padding:2px 8px;border-radius:10px}
  .topbar .note{margin-left:auto;color:var(--mut);font-size:12px}

  .workspace{display:flex;gap:14px;padding:14px;height:calc(100vh - 49px)}
  .nav-pane{display:flex;flex-direction:column;background:var(--pane);border:1px solid var(--line);border-radius:10px;overflow:hidden;transition:flex-basis .25s ease, width .25s ease}
  .reader-pane{background:var(--pane);border:1px solid var(--line);border-radius:10px;overflow:auto;padding:18px;transition:flex-basis .25s ease}
  /* focus states: who gets the width */
  .workspace.focus-browse .nav-pane{flex:0 0 58%}
  .workspace.focus-browse .reader-pane{flex:1 1 42%}
  .workspace.focus-read .nav-pane{flex:0 0 88px}
  .workspace.focus-read .reader-pane{flex:1 1 auto}

  /* tabs + toolbar */
  .tabs{display:flex;gap:6px;padding:10px 12px 0}
  .tab{border:1px solid var(--line);background:#f4f6f5;border-radius:7px 7px 0 0;padding:5px 11px;font-size:12px;cursor:pointer;color:var(--mut)}
  .tab.active{background:var(--pane);color:var(--ink);font-weight:600;border-bottom-color:var(--pane)}
  .toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line)}
  .toolbar input[type=search]{flex:1 1 180px;min-width:120px;padding:7px 10px;border:1px solid var(--line);border-radius:7px;font-size:13px}
  .seg{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden}
  .seg button{border:0;background:#f4f6f5;padding:7px 12px;font-size:12px;cursor:pointer;color:var(--mut)}
  .seg button.on{background:var(--acc);color:#fff;font-weight:600}
  select{padding:6px 8px;border:1px solid var(--line);border-radius:7px;font-size:12px;background:#fff;color:var(--ink)}
  select:disabled{opacity:.45;cursor:not-allowed}
  .lens-label{font-size:11px;color:var(--mut);margin-right:-3px}
  .matchnudge{font-size:12px;color:var(--acc-d);background:#e9f5f3;border:1px solid #cfe9e4;border-radius:7px;padding:5px 9px;cursor:pointer}
  .matchnudge:hover{background:#dcefeb}

  /* result region */
  .result{flex:1;overflow:auto;padding:6px 6px 14px}
  .row{display:flex;align-items:center;gap:8px;padding:5px 8px;border-radius:6px;cursor:pointer;white-space:nowrap}
  .row:hover{background:#f3f6f5}
  .row.sel{background:#e6f2f0;outline:1px solid #bfe0da}
  .row .caret{width:14px;text-align:center;color:var(--mut);flex:0 0 14px;font-size:11px}
  .row .caret.leaf{visibility:hidden}
  .row .code{font-variant-numeric:tabular-nums;font-weight:600;color:var(--acc-d);flex:0 0 auto}
  .row.cat .code{color:var(--ink)}
  .row .nm{color:var(--ink);overflow:hidden;text-overflow:ellipsis}
  .row.dim .nm{color:#9aa6a4}
  .row .sp{flex:1}
  .badge{font-size:11px;font-variant-numeric:tabular-nums;color:var(--mut);background:#f0f2f1;border-radius:9px;padding:1px 7px;flex:0 0 auto}
  .badge.tier{color:var(--acc-d);background:#e9f5f3}
  .tick{color:var(--acc);font-weight:700;flex:0 0 auto}
  .row.subline{box-shadow:inset 2px 0 0 var(--sun)}
  mark{background:var(--hi);color:inherit;padding:0 1px;border-radius:2px}
  .depth{display:inline-block}
  .more{font-size:12px;color:var(--mut);padding:4px 8px 4px 22px}
  .empty{color:var(--mut);padding:18px;text-align:center}

  /* rail (read focus) */
  .workspace.focus-read .toolbar,.workspace.focus-read .tabs{display:none}
  .workspace.focus-read .row .nm,.workspace.focus-read .row .sp,.workspace.focus-read .row .badge,.workspace.focus-read .row .caret,.workspace.focus-read .row .tick{display:none}
  .workspace.focus-read .row{justify-content:center;padding:5px 4px}
  .workspace.focus-read .more{display:none}
  .workspace.focus-read .result{padding:8px 2px}
  .railhint{font-size:10px;color:var(--mut);text-align:center;padding:8px 2px;border-bottom:1px solid var(--line)}
  .workspace.focus-browse .railhint{display:none}

  /* reader card */
  .ph{color:var(--mut);padding:40px 10px;text-align:center}
  .card h2{margin:0 0 2px;font-size:20px}
  .card .sub{color:var(--mut);font-size:12px;margin-bottom:14px}
  .card .flags{display:flex;gap:6px;margin:10px 0 16px;flex-wrap:wrap}
  .flag{font-size:11px;padding:2px 9px;border-radius:10px;border:1px solid var(--line);color:var(--mut)}
  .flag.on{border-color:var(--acc);color:var(--acc-d);background:#e9f5f3;font-weight:600}
  .field{margin:12px 0}
  .field .k{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--mut);margin-bottom:3px}
  .field .v{line-height:1.5}
  .readbtns{display:flex;gap:8px;margin-bottom:8px}
  .btn{border:1px solid var(--line);background:#f4f6f5;border-radius:7px;padding:6px 12px;font-size:12px;cursor:pointer;color:var(--ink)}
  .btn.primary{background:var(--acc);color:#fff;border-color:var(--acc);font-weight:600}
  .btn:hover{filter:brightness(.97)}
  .kbd{font-family:ui-monospace,monospace;font-size:11px;background:#eef1f0;border:1px solid var(--line);border-radius:4px;padding:0 5px}
  .previewnote{font-size:11px;color:var(--mut);margin-top:10px}
</style>
</head>
<body>
<div class="topbar">
  <b>MythoScope</b><span class="tag">mock</span>
  <span>Unified motif navigator</span>
  <span class="note">isolated demo · no API · real TMI slice · see docs/motifs/motifs-browser-ui.md</span>
</div>

<div class="workspace focus-browse" id="ws">
  <section class="nav-pane">
    <div class="tabs">
      <div class="tab active">TMI</div>
      <div class="tab" title="not in the mock">Berezkin</div>
      <div class="tab" title="not in the mock">ATU</div>
    </div>
    <div class="railhint">reading mode<br>↑/↓ to step<br>Esc to exit</div>
    <div class="toolbar" id="toolbar">
      <input type="search" id="q" placeholder="Search id, name or definition…">
      <span class="seg" id="viewseg">
        <button data-view="tree" class="on">⊟ Tree</button>
        <button data-view="list">☰ List</button>
      </span>
      <select id="chapter"></select>
      <select id="filter"></select>
      <span class="lens-label">sort</span>
      <select id="sort" disabled>
        <option value="id">code</option>
        <option value="notes">notes size</option>
        <option value="cult">cultures</option>
      </select>
      <span class="matchnudge" id="nudge" style="display:none"></span>
    </div>
    <div class="result" id="result"></div>
  </section>
  <section class="reader-pane" id="reader">
    <div class="ph">Select a motif to preview it here.<br>Open one to read it full-width.</div>
  </section>
</div>

"chapter": "D", "def": false, "defText": "", "cult": 0, "atu": false, "notes": 0, "sub": false, "leaf": false, "kids": 14}, {"id": "D110", "name": "Transformation: Man To Wild Beast (Mammal)", "level": 1, "parent": "D100", "chapter": "D", "def": false, "defText": "", "cult": 3, "atu": false, "notes": 157, "sub": true, "leaf": false, "kids": 8}]};
const DATA = RAW.motifs, CHAPS = RAW.chapters;
const BY = Object.fromEntries(DATA.map(m=>[m.id,m]));
const KIDS = {};
for(const m of DATA){ (KIDS[m.parent]=KIDS[m.parent]||[]).push(m.id); }
// roots: nodes whose parent is not part of the slice, grouped under their chapter
const ROOTS = {};
for(const m of DATA){ if(!BY[m.parent]) (ROOTS[m.chapter]=ROOTS[m.chapter]||[]).push(m.id); }
// render children/roots in catalog (code) order, not slice order
const byCode = (a,b)=>a.localeCompare(b,undefined,{numeric:true});
for(const k in KIDS) KIDS[k].sort(byCode);
for(const c in ROOTS) ROOTS[c].sort(byCode);

const S = { view:"tree", chapter:"", filter:"all", sort:"id", q:"", sel:null, focus:"browse", expanded:new Set() };

// ---- lenses -----------------------------------------------------------------
const TIER = { all:()=>true, def:m=>m.def, sub:m=>m.sub, atu:m=>m.atu };
function qhit(m){ if(!S.q) return false; const s=S.q.toLowerCase();
  return m.id.toLowerCase().includes(s) || (m.name||"").toLowerCase().includes(s) || (m.defText||"").toLowerCase().includes(s); }
function passes(m){ return TIER[S.filter](m) && (!S.q || qhit(m)); }

// subtree relevance: a node is shown if it (or any descendant) passes the lenses
const relMemo = new Map();
function relevant(id){
  if(relMemo.has(id)) return relMemo.get(id);
  let r = passes(BY[id]);
  for(const k of (KIDS[id]||[])) r = relevant(k) || r;
  relMemo.set(id,r); return r;
}
function clearMemo(){ relMemo.clear(); }

// tier counts within a subtree (for the swapping badge)
function subCounts(id){
  const c={all:0,def:0,sub:0,atu:0}; (function walk(x){ const m=BY[x];
    c.all++; if(m.def)c.def++; if(m.sub)c.sub++; if(m.atu)c.atu++;
    for(const k of (KIDS[x]||[])) walk(k); })(id);
  return c;
}

// ---- toolbar ----------------------------------------------------------------
function totals(scope){ // scope: list of ids
  const c={all:0,def:0,sub:0,atu:0};
  for(const id of scope){ const m=BY[id]; c.all++; if(m.def)c.def++; if(m.sub)c.sub++; if(m.atu)c.atu++; }
  return c;
}
function scopeIds(){ return DATA.filter(m=>!S.chapter||m.chapter===S.chapter).map(m=>m.id); }

function fillChapters(){
  const sel=document.getElementById("chapter");
  sel.innerHTML = `<option value="">All chapters (${DATA.length})</option>` +
    CHAPS.map(c=>{ const n=DATA.filter(m=>m.chapter===c.id).length;
      return `<option value="${c.id}"${c.id===S.chapter?" selected":""}>${c.id} — ${c.name} (${n})</option>`; }).join("");
}
function fillFilter(){
  const t=totals(scopeIds()); const sel=document.getElementById("filter");
  const opt=(v,l,n)=>`<option value="${v}"${v===S.filter?" selected":""}>${l} (${n})</option>`;
  sel.innerHTML = opt("all","Full index",t.all)+opt("def","With definitions",t.def)+
                  opt("sub","Substantive",t.sub)+opt("atu","With ATU types",t.atu);
}

// ---- render -----------------------------------------------------------------
function badge(counts){ // swaps to the active tier
  const n = counts[S.filter];
  return `<span class="badge tier">${n}</span>`;
}
function hl(text){ if(!S.q) return esc(text); const s=S.q.toLowerCase(), t=text||"";
  const i=t.toLowerCase().indexOf(s); if(i<0) return esc(t);
  return esc(t.slice(0,i))+"<mark>"+esc(t.slice(i,i+s.length))+"</mark>"+esc(t.slice(i+s.length)); }
function esc(s){ return (s||"").replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c])); }

function rowHtml(m,depth,{cat=false,tick=false,sub=false}={}){
  const leaf=!(KIDS[m.id]&&KIDS[m.id].length);
  const open=S.expanded.has(m.id);
  const caret = leaf?`<span class="caret leaf">•</span>`:`<span class="caret">${open?"▾":"▸"}</span>`;
  const dimmed = S.q && !qhit(m) && !cat;  // visible only as an ancestor of a match
  const tickEl = m.def?`<span class="tick" title="has a definition">✓</span>`:"";
  const b = cat?badge(subCounts(m.id)) : `<span class="badge${m.sub?" tier":""}">${badgeText(m)}</span>`;
  return `<div class="row${cat?" cat":""}${dimmed?" dim":""}${m.sub&&!cat?" subline":""}${m.id===S.sel?" sel":""}"
       data-id="${m.id}" style="padding-left:${8+depth*16}px">
     ${S.view==="tree"?caret:""}${tickEl}
     <span class="code">${hl(m.id)}</span>
     <span class="nm">${hl(m.name||"—")}</span><span class="sp"></span>${b}</div>`;
}
function badgeText(m){ // list-mode per-row badge depends on sort
  if(S.sort==="notes") return m.notes+"b";
  if(S.sort==="cult")  return m.cult+" cult";
  return (m.leaf?"leaf":m.kids+" sub");
}

function render(){
  clearMemo(); fillFilter();
  const r=document.getElementById("result");
  document.getElementById("sort").disabled = (S.view==="tree");
  document.getElementById("nudge").style.display = (S.view==="tree" && S.q)?"inline-block":"none";

  if(S.view==="list"){ renderList(r); }
  else { renderTree(r); }
  syncNudge();
}

function renderList(r){
  let rows = DATA.filter(m=>(!S.chapter||m.chapter===S.chapter) && passes(m));
  const dir = S.sort==="id"?1:-1;
  rows.sort((a,b)=> dir*( S.sort==="notes"? a.notes-b.notes : S.sort==="cult"? a.cult-b.cult :
            a.id.localeCompare(b.id,undefined,{numeric:true}) )* (S.sort==="id"?1:-1));
  if(!rows.length){ r.innerHTML=`<div class="empty">No motifs match these lenses.</div>`; return; }
  r.innerHTML = rows.map(m=>rowHtml(m,0,{tick:true})).join("");
  bind(r);
}

function renderTree(r){
  const out=[];
  const auto = !!S.q; // searching: auto-expand ancestors of matches
  function walk(id,depth){
    if(!relevant(id)) return;
    const m=BY[id], kids=(KIDS[id]||[]).filter(relevant);
    const isCat = depth===0 || (kids.length>0 && !m.def);
    out.push(rowHtml(m,depth,{cat:isCat}));
    const open = auto ? kids.some(k=>subHasMatch(k)) || S.expanded.has(id) : S.expanded.has(id);
    if(open) for(const k of kids) walk(k,depth+1);
  }
  for(const c of CHAPS){
    const roots=(ROOTS[c.id]||[]).filter(relevant);
    if(S.chapter && c.id!==S.chapter) continue;
    if(!roots.length) continue;
    // chapter header (collapsible)
    const key="chap:"+c.id;
    const chOpen = auto ? roots.some(subHasMatch) || S.expanded.has(key) : S.expanded.has(key);
    const cnt=totals(DATA.filter(m=>m.chapter===c.id).map(m=>m.id));
    out.push(`<div class="row cat" data-chap="${key}" style="padding-left:8px">
        <span class="caret">${chOpen?"▾":"▸"}</span><span class="code">${c.id}</span>
        <span class="nm">${esc(c.name)}</span><span class="sp"></span><span class="badge tier">${cnt[S.filter]}</span></div>`);
    if(chOpen) for(const id of roots) walk(id,1);
  }
  r.innerHTML = out.length?out.join(""):`<div class="empty">No motifs match these lenses.</div>`;
  bind(r);
}
function subHasMatch(id){ // any node in subtree directly matches the query
  if(qhit(BY[id])) return true;
  for(const k of (KIDS[id]||[])) if(subHasMatch(k)) return true;
  return false;
}

function bind(r){
  r.querySelectorAll(".row[data-id]").forEach(el=>{
    const id=el.dataset.id;
    el.addEventListener("click",()=>{
      const m=BY[id], leaf=!(KIDS[id]&&KIDS[id].length);
      if(S.view==="tree" && !leaf && !S.q){ // toggle expand on category rows
        S.expanded.has(id)?S.expanded.delete(id):S.expanded.add(id); render();
      }
      select(id);
    });
    el.addEventListener("dblclick",()=>{ select(id); setFocus("read"); });
  });
  r.querySelectorAll(".row[data-chap]").forEach(el=>{
    el.addEventListener("click",()=>{ const k=el.dataset.chap;
      S.expanded.has(k)?S.expanded.delete(k):S.expanded.add(k); render(); });
  });
}

// ---- selection + reader -----------------------------------------------------
function visibleOrder(){ return [...document.querySelectorAll(".result .row[data-id]")].map(el=>el.dataset.id); }
function select(id){
  S.sel=id;
  document.querySelectorAll(".row").forEach(el=>el.classList.toggle("sel",el.dataset.id===id));
  drawReader();
  const el=document.querySelector(`.row[data-id="${CSS.escape(id)}"]`);
  if(el) el.scrollIntoView({block:"nearest"});
}
function drawReader(){
  const rd=document.getElementById("reader");
  if(!S.sel){ rd.innerHTML=`<div class="ph">Select a motif to preview it here.<br>Open one to read it full-width.</div>`; return; }
  const m=BY[S.sel], reading=S.focus==="read";
  const flags=[["definition",m.def],["substantive",m.sub],["ATU-linked",m.atu]]
    .map(([k,on])=>`<span class="flag${on?" on":""}">${on?"✓ ":""}${k}</span>`).join("");
  const btns = reading
    ? `<button class="btn" onclick="setFocus('browse')">← Back to list</button>
       <span class="previewnote">Step with <span class="kbd">↑</span><span class="kbd">↓</span> · exit with <span class="kbd">Esc</span></span>`
    : `<button class="btn primary" onclick="setFocus('read')">Open to read →</button>
       <span class="previewnote">double-click a row, or press <span class="kbd">Enter</span></span>`;
  const fields = reading ? `
     <div class="field"><div class="k">Definition</div><div class="v">${m.def?esc(m.defText):"<i style='color:#9aa6a4'>— none —</i>"}</div></div>
     <div class="field"><div class="k">Position</div><div class="v">level ${m.level==null?"–":m.level} · ${m.leaf?"leaf":m.kids+" sub-motifs"} · chapter ${m.chapter}</div></div>
     <div class="field"><div class="k">Cultures</div><div class="v">${m.cult} attested</div></div>
     <div class="field"><div class="k">Notes</div><div class="v">${m.notes} bytes</div></div>
     <div class="field"><div class="k">ATU</div><div class="v">${m.atu?"linked":"—"}</div></div>`
    : `<div class="field"><div class="k">Definition</div><div class="v">${m.def?esc(m.defText):"<i style='color:#9aa6a4'>— none —</i>"}</div></div>
       <div class="previewnote">preview · open to read full record</div>`;
  rd.innerHTML=`<div class="card">
     <div class="readbtns">${btns}</div>
     <h2>${esc(m.id)} · ${esc(m.name||"—")}</h2>
     <div class="sub">level ${m.level==null?"–":m.level} · ${m.leaf?"leaf node":m.kids+" sub-motifs"}</div>
     <div class="flags">${flags}</div>${fields}</div>`;
}

function setFocus(f){
  S.focus=f;
  document.getElementById("ws").className="workspace focus-"+f;
  drawReader();
}

// ---- nudge (show-as-list affordance while searching in tree) ----------------
function syncNudge(){
  const n=document.getElementById("nudge");
  if(S.view!=="tree"||!S.q){ return; }
  const cnt=DATA.filter(m=>(!S.chapter||m.chapter===S.chapter)&&passes(m)).length;
  n.textContent=`${cnt} match${cnt===1?"":"es"} — show as list →`;
}

// ---- wiring -----------------------------------------------------------------
document.getElementById("q").addEventListener("input",e=>{ S.q=e.target.value.trim(); render(); });
document.getElementById("viewseg").addEventListener("click",e=>{
  const b=e.target.closest("button[data-view]"); if(!b) return;
  S.view=b.dataset.view;
  document.querySelectorAll("#viewseg button").forEach(x=>x.classList.toggle("on",x===b));
  render();
});
document.getElementById("chapter").addEventListener("change",e=>{ S.chapter=e.target.value; render(); });
document.getElementById("filter").addEventListener("change",e=>{ S.filter=e.target.value; render(); });
document.getElementById("sort").addEventListener("change",e=>{ S.sort=e.target.value; render(); });
document.getElementById("nudge").addEventListener("click",()=>{
  S.view="list"; document.querySelectorAll("#viewseg button").forEach(x=>x.classList.toggle("on",x.dataset.view==="list")); render();
});
document.addEventListener("keydown",e=>{
  if(e.key==="Escape" && S.focus==="read"){ setFocus("browse"); return; }
  if(e.key==="Enter" && S.sel && S.focus==="browse"){ setFocus("read"); return; }
  if((e.key==="ArrowDown"||e.key==="ArrowUp")){
    const order=visibleOrder(); if(!order.length) return;
    e.preventDefault();
    let i=order.indexOf(S.sel); i = e.key==="ArrowDown"? Math.min(order.length-1,i+1) : Math.max(0,i-1);
    if(i<0) i=0; select(order[i]);
  }
});

// start with only the first chapter open (its level-0 categories collapsed)
if(CHAPS[0]) S.expanded.add("chap:"+CHAPS[0].id);
fillChapters(); render();
</script>
