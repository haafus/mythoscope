<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tradition → motif biclusters, combined — mockup</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
         color: #212529; background: #faf9f5; }
  header { padding: 12px 20px; border-bottom: 1px solid #dee2e6; background: #fff; }
  header h1 { font-size: 15px; margin: 0 0 2px; }
  header .sub { color: #6c757d; font-size: 12px; }
  .tabs { display: flex; gap: 8px; max-width: 1240px; margin: 14px auto 0; padding: 0 20px; flex-wrap: wrap; }
  .tab { padding: 8px 16px; font-size: 13px; font-weight: 700; border: 1px solid #dee2e6; background: #fff;
         border-radius: 8px; cursor: pointer; color: #6c757d; }
  .tab.active { color: #fff; }
  .grid { display: grid; grid-template-columns: 320px minmax(0,1fr); gap: 16px; max-width: 1240px;
          margin: 12px auto 0; padding: 0 20px 60px; align-items: start; }
  .panel { border: 1px solid #dee2e6; border-radius: 10px; background: #fff; }
  .panel h2 { font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: #6c757d;
              margin: 0; padding: 11px 13px; border-bottom: 1px solid #f1f3f5; }
  .clu { padding: 10px 13px; border-bottom: 1px solid #f1f3f5; cursor: pointer; }
  .clu:hover { background: #f7f9fb; } .clu.active { background: #eef4fb; }
  .clu .lab { font-size: 12.5px; font-weight: 600; line-height: 1.35; }
  .comp { display: flex; gap: 3px; margin-top: 6px; height: 7px; border-radius: 4px; overflow: hidden; background: #eef1f4; }
  .comp > i { height: 100%; }
  .clu .cnt { color: #9299a1; font-size: 11px; }
  #search { width: 100%; padding: 9px 12px; font-size: 13px; border: 1px solid #dee2e6; border-radius: 8px; margin-bottom: 12px; }
  #ac { position: absolute; z-index: 20; background: #fff; border: 1px solid #dee2e6; border-radius: 8px;
        max-height: 320px; overflow-y: auto; box-shadow: 0 6px 18px rgba(0,0,0,.09); display: none; }
  #ac div { padding: 6px 11px; font-size: 12.5px; cursor: pointer; border-bottom: 1px solid #f1f3f5; }
  #ac div:hover { background: #eef4fb; }
  .sec { padding: 13px 15px; border-bottom: 1px solid #f1f3f5; }
  .sec .h { font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: #6c757d; font-weight: 700; margin-bottom: 8px; }
  .chip { display: inline-block; font-size: 12px; padding: 3px 9px; margin: 0 5px 5px 0; border-radius: 13px;
          background: #eef2f6; color: #37414b; }
  .m { padding: 8px 15px; border-bottom: 1px solid #f6f8fa; }
  .m .code { font-weight: 700; } .m .nm { font-size: 13px; }
  .m .tt { color: #9299a1; font-size: 11px; margin-top: 1px; }
  .mem { float: right; display: inline-flex; align-items: center; gap: 6px; font-size: 11px;
         color: #6c757d; font-variant-numeric: tabular-nums; }
  .mem .mbar { width: 42px; height: 5px; border-radius: 3px; background: #eef1f4; overflow: hidden; }
  .mem .mbar > i { display: block; height: 100%; background: #6a97c4; }
  .chip .cs { color: #9299a1; font-weight: 400; font-size: 10.5px; margin-left: 4px; font-variant-numeric: tabular-nums; }
  .memhint { font-size: 10.5px; color: #9299a1; font-weight: 400; text-transform: none; letter-spacing: 0; }
  .badge { display: inline-block; font-size: 10px; font-weight: 700; padding: 1px 6px; border-radius: 5px; vertical-align: middle; }
  .idxrow { display: flex; gap: 14px; font-size: 12px; color: #495057; margin-top: 4px; }
  .sw { display: inline-block; width: 11px; height: 11px; border-radius: 3px; margin-right: 7px; vertical-align: middle; }
  .mapcard { border: 1px solid #dee2e6; border-radius: 10px; overflow: hidden; position: relative; margin-bottom: 16px; }
  svg.map { display: block; width: 100%; height: auto; background: linear-gradient(#eef4f8,#e6eef4); }
  .mapnote { position: absolute; right: 10px; bottom: 8px; font-size: 10.5px; color: #6c86a0;
             background: rgba(255,255,255,.7); padding: 2px 7px; border-radius: 6px; }
  .tip { position: fixed; z-index: 40; pointer-events: none; background: #111827; color: #fff;
         padding: 4px 8px; border-radius: 6px; font-size: 11.5px; display: none; }
  .tip .tk { opacity: .65; }
  #clearsel { position: absolute; left: 10px; top: 10px; display: none; align-items: center; gap: 6px;
              padding: 5px 11px; font-size: 12px; font-weight: 600; border: 1px solid #cbd5e0;
              border-radius: 7px; background: rgba(255,255,255,.94); color: #33465c; cursor: pointer; }
  #clearsel:hover { background: #fff; border-color: #9aacc0; }
  #clearsel .sw { width: 10px; height: 10px; border-radius: 3px; margin: 0; }
  svg.map circle { cursor: pointer; }
</style>
</head>
<body>
<header>
  <h1>Tradition → motif biclusters — combined</h1>
  <div class="sub">One view: <b>All</b> co-clusters the motif × tradition table across TMI, ATU and Berezkin at once; each index tab co-clusters that catalogue on its own. Traditions plotted on the map, coloured by cluster.</div>
</header>
<div class="tabs" id="tabs"></div>
<div class="grid">
  <div>
    <div style="position:relative"><input id="search" placeholder="Find a tradition / people…" autocomplete="off"><div id="ac"></div></div>
    <div class="panel"><h2 id="clh">Co-clusters</h2><div id="clusters"></div></div>
  </div>
  <div>
    <div class="mapcard"><svg class="map" id="map" viewBox="0 0 360 180" preserveAspectRatio="xMidYMid meet"></svg><button id="clearsel"><span class="sw" id="clearsw"></span>Show all clusters</button><div class="mapnote" id="mapnote"></div></div>
    <div class="panel" id="right"><h2 id="rtitle">Select a co-cluster</h2>
      <div id="rbody" style="padding:14px;color:#9299a1;font-size:13px"></div>
    </div>
  </div>
</div>
<div class="tip" id="tip"></div>
<script src="land.js"></script>
<script src="data.js"></script>
<script>
const D = DATA;
// Index colours for the per-motif / per-index badges shown in the "All" view.
const IDXB = { tmi:{c:"#2a9d8f",l:"TMI"}, atu:{c:"#3a6ea5",l:"ATU"}, brz:{c:"#b5651d",l:"Berezkin"} };
// Tab row: "All" first, then each catalogue.
const TAB = { all:{c:"#37414b",l:"All indexes"}, brz:{c:"#b5651d",l:"Berezkin"},
              tmi:{c:"#2a9d8f",l:"Thompson (TMI)"}, atu:{c:"#3a6ea5",l:"ATU tale types"} };
const ORDER = ["all","brz","tmi","atu"];
const PAL = ["#e6194b","#3cb44b","#4363d8","#f58231","#911eb4","#46f0f0","#f032e6","#bcf60c",
             "#fabebe","#008080","#9a6324","#800000","#808000","#000075","#e6beff","#a9a9a9","#ffd8b1","#aaffc3"];
const esc = s => (s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let cur = "all", sel = -1;
const map=document.getElementById("map"), mapnote=document.getElementById("mapnote"), tip=document.getElementById("tip");
const clearsel=document.getElementById("clearsel"), clearsw=document.getElementById("clearsw");
const rtitle=document.getElementById("rtitle"), rbody=document.getElementById("rbody");
const clh=document.getElementById("clh"), clusters=document.getElementById("clusters");
const INTRO = "Pick a co-cluster (or a dot on the map) to see its traditions and the motifs characteristic of them.";

document.getElementById("tabs").innerHTML = ORDER.map(ix=>`<div class="tab" data-ix="${ix}">${TAB[ix].l}</div>`).join("");
const nMotifs = d => d.n_motifs_total ?? d.n_motifs;
function label(c){ return c.traditions.slice(0,3).map(esc).join(" · "); }
function comp(by){ if(!by) return ""; const tot=(by.tmi||0)+(by.atu||0)+(by.brz||0)||1;
  return `<div class="comp">`+["tmi","atu","brz"].map(x=>by[x]?`<i style="width:${100*by[x]/tot}%;background:${IDXB[x].c}" title="${IDXB[x].l} ${by[x]}"></i>`:"").join("")+`</div>`; }

function drawMap(){
  const d = D[cur];
  let g="";
  for(let lon=-180;lon<=180;lon+=30) g+=`<line x1="${lon+180}" y1="0" x2="${lon+180}" y2="180" stroke="#cfdce6" stroke-width="0.3"/>`;
  for(let lat=-90;lat<=90;lat+=30) g+=`<line x1="0" y1="${90-lat}" x2="360" y2="${90-lat}" stroke="#cfdce6" stroke-width="0.3"/>`;
  const land = `<path d="${window.LAND||""}" fill="#e7ecdd" stroke="#c3cfbc" stroke-width="0.25"/>`;
  const pts=d.points.map((p,i)=>{ const on=sel<0||p.k===sel;
    const col = (sel<0||on) ? PAL[p.k%PAL.length] : "#9aa7b2";
    const r  = sel<0 ? 1.15 : (on ? 2.2 : 0.8);
    const op = sel<0 ? 0.92 : (on ? 1 : 0.13);
    const halo = on&&sel>=0 ? ` stroke="#12233a" stroke-width="0.35"` : "";
    return `<circle cx="${p.x+180}" cy="${90-p.y}" r="${r}" fill="${col}" fill-opacity="${op}"${halo} data-i="${i}"/>`;}).join("");
  map.innerHTML=g+land+pts;
  mapnote.textContent=`${d.placed} of ${d.n_traditions} traditions placed (approx. centroids)`;
  clearsel.style.display = sel>=0 ? "inline-flex" : "none";
  if(sel>=0) clearsw.style.background = PAL[sel%PAL.length];
}
let hoverEl=null, hoverR=null;
function unhover(){ if(hoverEl){ hoverEl.setAttribute("r",hoverR); hoverEl.removeAttribute("stroke"); hoverEl=null; } }
map.addEventListener("mousemove",e=>{const t=e.target;
  if(t.tagName!=="circle"||t.dataset.i===undefined){ unhover(); tip.style.display="none"; return; }
  if(t!==hoverEl){ unhover(); hoverEl=t; hoverR=t.getAttribute("r");
    t.setAttribute("r", Math.max(2.6,(+hoverR)+1.4)); t.setAttribute("stroke","#111827"); t.setAttribute("stroke-width","0.5"); t.setAttribute("fill-opacity","1"); }
  const p=D[cur].points[+t.dataset.i]; tip.style.display="block"; tip.style.left=(e.clientX+12)+"px"; tip.style.top=(e.clientY+8)+"px";
  tip.innerHTML=`${esc(p.t)} <span class="tk">${Math.round((p.s||0)*100)}% in-cluster</span>`+
    `<br><span class="tk">cluster ${p.k+1} · ${esc((D[cur].clusters[p.k].traditions||[]).slice(0,2).join(", "))}</span>`;});
map.addEventListener("mouseleave",()=>{ unhover(); tip.style.display="none"; });
map.addEventListener("click",e=>{const t=e.target;
  if(t.tagName==="circle"&&t.dataset.i!==undefined){ show(D[cur].points[+t.dataset.i].k); unhover(); }
  else reset(); });
clearsel.addEventListener("click",reset);

function reset(){ sel=-1; drawMap();
  document.querySelectorAll(".clu").forEach(el=>el.classList.remove("active"));
  rtitle.textContent="Select a co-cluster";
  rbody.style.padding="14px"; rbody.style.color="#9299a1"; rbody.innerHTML=INTRO; }

function renderList(){
  const d = D[cur], accent = TAB[cur].c; sel=-1;
  document.querySelectorAll(".tab").forEach(t=>{ const on=t.dataset.ix===cur;
    t.classList.toggle("active",on); t.style.background=on?accent:"#fff"; t.style.borderColor=on?accent:"#dee2e6"; t.style.color=on?"#fff":"#6c757d"; });
  const src = cur==="all" && d.by_index_total
    ? ` · sources: TMI ${d.by_index_total.tmi||0}, ATU ${d.by_index_total.atu||0}, Berezkin ${d.by_index_total.brz||0}` : "";
  clh.textContent = `${nMotifs(d).toLocaleString()} motifs · ${d.n_traditions.toLocaleString()} traditions · ${d.clusters.length} co-clusters${src}`;
  clusters.innerHTML = d.clusters.map((c,i)=>
    `<div class="clu" data-c="${i}"><span class="cnt" style="float:right">${c.n_motif}</span>`+
    `<div class="lab"><span class="sw" style="background:${PAL[i%PAL.length]}"></span>${label(c)}</div>${comp(c.by_index)}</div>`).join("");
  reset();
  buildSearch();
}

function show(i){
  const d = D[cur], c = d.clusters[i], pc = PAL[i%PAL.length]; sel=i; drawMap();
  document.querySelectorAll(".clu").forEach(e=>e.classList.toggle("active",+e.dataset.c===i));
  rtitle.textContent = `Co-cluster ${i+1} — ${c.n_trad} traditions, ${c.n_motif} motifs`;
  rbody.style.padding="0"; rbody.style.color="";
  const tm = d.trad_mem || {};
  const memPct = t => tm[t]!=null ? `<span class="cs">${Math.round(tm[t]*100)}%</span>` : "";
  const trads = c.traditions.map((t,j)=>`<span class="chip" ${j<6?`style="background:${pc}1e;color:${pc};font-weight:600"`:''} title="${Math.round((tm[t]||0)*100)}% of this people's motifs fall in this cluster">${esc(t)}${memPct(t)}</span>`).join("");
  const idxrow = c.by_index ? `<div class="idxrow">`+["tmi","atu","brz"].filter(x=>c.by_index[x]).map(x=>
    `<span><span class="badge" style="background:${IDXB[x].c}22;color:${IDXB[x].c}">${IDXB[x].l}</span> ${c.by_index[x]}</span>`).join("")+`</div>` : "";
  const mot = c.motifs.map(m=>{ const pct=Math.round((m.s||0)*100), k=m.x?IDXB[m.x]:null, col=k?k.c:pc;
    return `<div class="m"><span class="mem" title="${pct}% of this motif's traditions are in this cluster">`+
      `<span class="mbar"><i style="width:${pct}%;background:${col}"></i></span>${pct}%</span>`+
      (k?`<span class="badge" style="background:${k.c}22;color:${k.c}">${k.l}</span> `:"")+
      `<span class="code" style="color:${col}">${esc(m.c)}</span> <span class="nm">${esc(m.n)}</span>`+
      (m.t&&m.t.length?`<div class="tt">${m.t.map(esc).join(" · ")}</div>`:"")+`</div>`;}).join("");
  rbody.innerHTML =
    `<div class="sec"><div class="h">Characteristic traditions (${c.n_trad}) <span class="memhint">— % = share of the people's motifs in this cluster</span></div>${trads}${idxrow}</div>`+
    `<div class="sec" style="border:0;padding-bottom:2px"><div class="h">Characteristic motifs — top ${c.motifs.length} of ${c.n_motif} <span class="memhint">— % = share of the motif's traditions in this cluster</span></div></div>${mot}`;
}
clusters.addEventListener("click",e=>{const c=e.target.closest("[data-c]"); if(!c)return;
  const i=+c.dataset.c; if(i===sel) reset(); else show(i);});
document.getElementById("tabs").addEventListener("click",e=>{const t=e.target.closest("[data-ix]"); if(!t)return;
  cur=t.dataset.ix; document.getElementById("search").value=""; renderList();});

// search a tradition -> jump to the cluster that owns it (rebuilt per view)
let clusterOf=new Map(), allTrad=[];
function buildSearch(){ clusterOf=new Map();
  D[cur].clusters.forEach((c,i)=>c.traditions.forEach(t=>{ if(!clusterOf.has(t.toLowerCase())) clusterOf.set(t.toLowerCase(), i); }));
  allTrad=[...new Set(D[cur].clusters.flatMap(c=>c.traditions))].sort(); }
const search=document.getElementById("search"), ac=document.getElementById("ac");
search.addEventListener("input",()=>{ const s=search.value.trim().toLowerCase(); if(s.length<2){ac.style.display="none";return;}
  const hits=allTrad.filter(t=>t.toLowerCase().includes(s)).slice(0,40);
  ac.innerHTML=hits.map(t=>`<div data-t="${esc(t)}">${esc(t)} <span style="color:#9299a1">→ cluster ${clusterOf.get(t.toLowerCase())+1}</span></div>`).join("")||`<div style="color:#9299a1">no match</div>`;
  const r=search.getBoundingClientRect(); ac.style.left=r.left+"px"; ac.style.top=(r.bottom+4)+"px"; ac.style.width=r.width+"px"; ac.style.display="block"; });
ac.addEventListener("click",e=>{const d=e.target.closest("[data-t]"); if(!d)return; ac.style.display="none"; search.value=d.dataset.t;
  show(clusterOf.get(d.dataset.t.toLowerCase())); });
document.addEventListener("click",e=>{ if(!ac.contains(e.target)&&e.target!==search) ac.style.display="none"; });

renderList();
</script>
</body>
</html>
