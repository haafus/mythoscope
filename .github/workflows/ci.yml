name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff
      - name: Ruff
        run: ruff check src tests scripts

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"   # Node >=21: the test runner expands the "tests/js/*.test.mjs" glob (and 20 is deprecated on runners)
      - name: Frontend unit tests
        run: npm test

  # TODO: a full Python test job (python -m pytest) needs the install-profile
  # decision (viewer / search / all) and pulls heavy deps (torch, chromadb, umap).
  # Add once a lightweight test extra exists — see docs/proposals/public-docs-plan.md §17.
